<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Published Knowledge</title>
<style>body{font:14px system-ui;margin:28px;color:#17212b;background:#f6f8fa}main{max-width:1200px;margin:auto;background:#fff;padding:20px;border:1px solid #d8dee6;border-radius:8px}header{display:flex;gap:14px;align-items:center;margin-bottom:18px}input,button,textarea{font:inherit;padding:7px;border:1px solid #b8c2cc;border-radius:5px}input{width:180px}button{cursor:pointer;background:#fff}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px;border-bottom:1px solid #e5e7eb;vertical-align:top}.actions{display:flex;gap:5px;flex-wrap:wrap}#detail{white-space:pre-wrap;background:#f8fafc;padding:10px;max-height:420px;overflow:auto}textarea{width:100%;min-height:260px;box-sizing:border-box}.muted{color:#667085}</style></head>
<body><main><header><h1>Published Knowledge</h1><a href="/review">← Review</a><label>API Key <input id="key" type="password"></label><input id="reviewer" value="internal-reviewer" placeholder="Reviewer"><button id="refresh">Refresh</button><span id="status" class="muted"></span></header><table><thead><tr><th>Knowledge Key</th><th>Title</th><th>Scope</th><th>Models</th><th>Published At</th><th>Published By</th><th></th></tr></thead><tbody id="rows"></tbody></table><section><h2>View / Edit</h2><textarea id="editor" placeholder="Select View or Edit"></textarea><button id="save" hidden>Save as new draft version</button><pre id="detail"></pre></section></main>
<script>
const $=x=>document.getElementById(x),key=$('key');key.value=sessionStorage.getItem('review-api-key')||'';$('reviewer').value=sessionStorage.getItem('reviewer-name')||'internal-reviewer';
const headers=(json=false)=>({'x-api-key':key.value,...(json?{'content-type':'application/json'}:{})});async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(Boolean(opt.body)),...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.detail||`HTTP ${r.status}`);return d}
function text(value){return value==null?'':String(value)}function show(data,edit=false){$('detail').textContent=edit?'':JSON.stringify(data,null,2);$('editor').value=edit?JSON.stringify({title:data.title,knowledge_type:data.knowledge_type,scope:data.scope,question_patterns:data.question_patterns,claims:data.claims,procedure_steps:data.procedure_steps,conditions:data.conditions,exceptions:data.exceptions,warnings:data.warnings},null,2):'';$('save').hidden=!edit;$('save').dataset.id=data.verified_knowledge_id}
async function load(){try{const data=await api('/api/review/published');$('rows').replaceChildren();for(const item of data.items||[]){const tr=document.createElement('tr');const cells=[item.knowledge_key,item.title,JSON.stringify(item.scope||{}),text((item.models||[]).join(', ')||'generic'),text(item.published_at),text(item.published_by)];for(const value of cells){const td=document.createElement('td');td.textContent=value;tr.append(td)}const td=document.createElement('td'),actions=document.createElement('div');actions.className='actions';const view=document.createElement('button');view.textContent='View';view.onclick=async()=>show(await api(`/api/review/verified/${item.verified_knowledge_id}`));const edit=document.createElement('button');edit.textContent='Edit';edit.onclick=async()=>show(await api(`/api/review/verified/${item.verified_knowledge_id}`),true);const unpublish=document.createElement('button');unpublish.textContent='Unpublish';unpublish.onclick=()=>change(item.verified_knowledge_id,'unpublish');const archive=document.createElement('button');archive.textContent='Archive';archive.onclick=()=>change(item.verified_knowledge_id,'archive');actions.append(view,edit,unpublish,archive);td.append(actions);tr.append(td);$('rows').append(tr)}$('status').textContent=`${data.total||0} published`}catch(e){$('status').textContent=e.message}}
async function change(id,action){try{await api(`/api/review/verified/${id}/${action}`,{method:'POST',body:JSON.stringify({reviewer:$('reviewer').value})});await load()}catch(e){$('status').textContent=e.message}}
$('save').onclick=async()=>{try{const body=JSON.parse($('editor').value);body.reviewer=$('reviewer').value;await api(`/api/review/verified/${$('save').dataset.id}/edit`,{method:'POST',body:JSON.stringify(body)});$('status').textContent='Saved as draft version';await load()}catch(e){$('status').textContent=e.message}};$('refresh').onclick=load;key.onchange=load;if(key.value)load();
</script></body></html>
