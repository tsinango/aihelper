var(--muted);font-size:12px}.trust{padding:3px 7px;border-radius:99px;background:#eef2f6}.trust.official_source{background:#ecfdf3;color:var(--green)}.trust.user_confirmed{background:var(--blue-soft);color:var(--blue)}.trust.provisional{background:#fff7ed;color:var(--amber)}.trust.conflicted{background:#fff1f0;color:var(--red)}.sources{border-top:1px solid #edf0f3;margin-top:12px;padding-top:10px;color:var(--muted);font-size:12px}.empty{padding:55px 20px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:11px}.error{color:var(--red);background:#fff1f0;border:1px solid #fecaca;border-radius:8px;padding:9px 11px;margin-bottom:12px}@media(max-width:720px){.shell{padding:0 10px}.topbar{padding:10px 0}.top-inner{flex-wrap:wrap;gap:8px}.keybox{width:100%;margin-left:0}.keybox input{flex:1}.heading{display:block}.heading button{margin-top:10px}}

  <script>
    const $=id=>document.getElementById(id),key=$('api-key');key.value=sessionStorage.getItem('x-api-key')||'';function saveKey(){const clean=key.value.trim();sessionStorage.setItem('x-api-key',clean);$('key-status').textContent=clean?'已保存':'未设置'}saveKey();$('save-key').addEventListener('click',()=>{saveKey();$('key-settings').open=false;load()});key.addEventListener('keydown',event=>{if(event.key==='Enter')$('save-key').click()});const headers=json=>({'x-api-key':sessionStorage.getItem('x-api-key')||'',...(json?{'Content-Type':'application/json'}:{})});async function api(path,options={}){if(!sessionStorage.getItem('x-api-key')){$('key-settings').open=true;key.focus();throw Error('请先在设置中保存 API Key')}let r;try{r=await fetch(path,{...options,headers:{...headers(Boolean(options.body)),...(options.headers||{})}})}catch(_){throw Error('无法连接服务，请确认 API 已启动')}let d={};try{d=await r.json()}catch(_){ }if(!r.ok)throw Error(d.detail||d.message||`请求失败（${r.status}）`);return d}function items(data){if(Array.isArray(data))return data;if(!data||typeof data!=='object')return [];const result=data.items||data.knowledge||data.results||[];return Array.isArray(result)?result:[]}function text(item,...keys){for(const key of keys)if(item&&item[key]!=null)return item[key];return ''}function displayDate(raw){if(!raw)return '';const date=new Date(raw);return Number.isNaN(date.getTime())?String(raw):date.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}function trustLabel(trust){return {official_source:'官方资料',user_confirmed:'用户确认',provisional:'待确认',conflicted:'存在冲突'}[trust]||trust||'未标记'}function showSources(sources,count){const list=sources==null||sources===''?[]:Array.isArray(sources)?sources:[sources],labels=list.map(source=>typeof source==='string'?source:text(source,'title','name','label','filename')).filter(Boolean).map(String);if(!labels.length&&count==null)return '';return `<div class="sources">来源：${labels.length?labels.map(escape).join('、'):`${Number(count)||0} 条原始来源`}</div>`}function escape(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(list){const query=$('search').value.trim().toLowerCase(),filtered=list.filter(item=>!query||JSON.stringify(item).toLowerCase().includes(query));$('summary').textContent=`${filtered.length} 条知识`;$('knowledge-list').replaceChildren();if(!filtered.length){$('knowledge-list').innerHTML='<div class="empty">没有找到匹配的知识。</div>';return}for(const item of filtered){const trust=String(text(item,'trust','status')||'').toLowerCase(),card=document.createElement('article');card.className='card';card.innerHTML=`<h2>${escape(text(item,'title','name')||'未命名知识')}</h2><div class="entity">${escape(text(item,'entity_name','entity','model')||'产品知识')}</div><p>${escape(text(item,'content','text','answer')||'暂无内容')}</p><div class="meta"><span class="trust ${escape(trust)}">${escape(trustLabel(trust))}</span><span>${escape(displayDate(text(item,'updated_at','created_at')))}</span></div>${showSources(text(item,'sources','source'),text(item,'source_count'))}`;$('knowledge-list').append(card)}}let all=[];async function load(){try{$('error').hidden=true;const data=await api('/api/v2/knowledge');all=items(data);render(all)}catch(e){$('error').textContent=e.message;$('error').hidden=false;$('knowledge-list').innerHTML='<div class="empty">暂时无法加载知识。</div>'}}$('search').addEventListener('input',()=>render(all));$('clear').onclick=()=>{$('search').value='';render(all)};$('refresh').onclick=load;load();

  <script>
    const org$=id=>document.getElementById(id);
    const orgKey=org$('api-key');
    function orgStoredKey(){return sessionStorage.getItem('x-api-key')||''}
    orgKey.value=orgStoredKey();
    function orgSaveKey(){const clean=orgKey.value.trim();sessionStorage.setItem('x-api-key',clean);org$('key-status').textContent=clean?'已保存':'未设置'}
    orgSaveKey();
    org$('save-key').addEventListener('click',()=>{orgSaveKey();org$('key-settings').open=false;orgLoad()});
    orgKey.addEventListener('keydown',event=>{if(event.key==='Enter')org$('save-key').click()});
    async function orgApi(path,options={}){if(!orgStoredKey()){org$('key-settings').open=true;orgKey.focus();throw Error('请先在设置中保存 API Key')}let response;try{response=await fetch(path,{cache:'no-store',...options,headers:{'x-api-key':orgStoredKey(),...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}})}catch(_){throw Error('无法连接服务，请确认 API 已启动')}let data={};try{data=await response.json()}catch(_){ }if(!response.ok)throw Error(data.detail||data.message||`请求失败（${response.status}）`);return data}
    function orgItems(data){if(Array.isArray(data))return data;if(!data||typeof data!=='object')return [];const result=data.items||data.knowledge||data.results||[];return Array.isArray(result)?result:[]}
    function orgText(item,...keys){for(const key of keys)if(item&&item[key]!=null)return item[key];return ''}
    function orgEscape(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function orgDate(raw){if(!raw)return '';const date=new Date(raw);return Number.isNaN(date.getTime())?String(raw):date.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
    function orgTrust(trust){return {official_source:'官方资料',user_confirmed:'用户确认',provisional:'待确认',conflicted:'存在冲突'}[trust]||trust||'未标记'}
    function sourceLabels(sources){if(sources==null||sources==='')return [];const list=Array.isArray(sources)?sources:[sources];return list.map(source=>typeof source==='string'?source:orgText(source,'title','name','label','filename')).filter(Boolean).map(String)}
    function showSources(sources,count){const list=sources==null||sources===''?[]:Array.isArray(sources)?sources:[sources];const labels=sourceLabels(list);if(!labels.length&&count==null)return '';return `<div class="sources">来源：${labels.length?labels.map(orgEscape).join('、'):`${Number(count)||0} 条原始来源`}</div>`}
    const orgState={all:[],tree:{roots:[],unorganized:[]},selected:null,active:true,searchTimer:null};
    function orgMarkSelected(){org$('entity-tree').querySelectorAll('summary[data-entity-id]').forEach(summary=>summary.classList.toggle('selected',String(summary.dataset.entityId)===String(orgState.selected)))}
    function orgDescendantCount(node){const total=Number(node&&node.subtree_entity_count);return Number.isFinite(total)&&total>0?Math.max(0,total-1):Array.isArray(node&&node.children)?node.children.length:0}
    function orgNode(node,depth=0){if(!node||node.id==null)return null;const details=document.createElement('details');details.className='tree-node'+(node.children&&node.children.length?'':' leaf');details.open=depth<1;const summary=document.createElement('summary');summary.dataset.entityId=String(node.id);if(String(node.id)===String(orgState.selected))summary.classList.add('selected');const label=document.createElement('span');label.className='tree-label';const name=document.createElement('span');name.textContent=node.name||'未命名实体';const count=document.createElement('span');count.className='tree-count';count.textContent=String(Number(node.knowledge_count)||0);label.append(name,count);if(node.prune_allowed){const prune=orgButton(node.children&&node.children.length?'删除空分支':'删除',event=>{event.preventDefault();event.stopPropagation();orgPrune(node)},'tree-prune');prune.title='仅删除没有任何 Knowledge 引用的空结构';label.append(prune)}summary.append(label);summary.onclick=()=>{orgSelect(node.id)};details.append(summary);if(node.children&&node.children.length){const children=document.createElement('div');children.className='tree-children';for(const child of node.children){const rendered=orgNode(child,depth+1);if(rendered)children.append(rendered)}details.append(children)}return details}
    function orgTree(tree){const box=org$('entity-tree');box.replaceChildren();const roots=Array.isArray(tree&&tree.roots)?tree.roots:[],orphans=Array.isArray(tree&&tree.unorganized)?tree.unorganized:[];if(!roots.length&&!orphans.length){box.innerHTML='<div class="empty">还没有实体结构。</div>';return}for(const node of roots){const rendered=orgNode(node);if(rendered)box.append(rendered)}if(orphans.length){const title=document.createElement('div');title.className='tree-group-title';title.textContent='未整理';box.append(title);for(const node of orphans){const rendered=orgNode(node);if(rendered)box.append(rendered)}}}
    function orgEntityOptions(tree){const output=[];const seen=new Set();function walk(nodes){for(const node of Array.isArray(nodes)?nodes:[]){if(!node||node.id==null||seen.has(node.id))continue;seen.add(node.id);output.push(node);walk(node.children)}}walk(tree&&tree.roots);walk(tree&&tree.unorganized);return output.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'zh-CN'))}
    function orgButton(label,handler,kind=''){const button=document.createElement('button');button.type='button';button.textContent=label;if(kind)button.className=kind;button.addEventListener('click',handler);return button}
    function orgDetails(card,className){const old=card.querySelector(`.${className}`);if(old){old.hidden=!old.hidden;return old}const details=document.createElement('div');details.className=`inline-details ${className}`;card.append(details);return details}
    async function orgSources(item,card){const existing=card.querySelector('.source-details');if(existing){existing.hidden=!existing.hidden;return}const details=orgDetails(card,'source-details');details.textContent='正在加载来源…';try{const data=await orgApi(`/api/v2/knowledge/${encodeURIComponent(item.id)}/sources`);details.replaceChildren();const heading=document.createElement('h3');heading.textContent='来源';details.append(heading);const sources=orgItems(data);if(!sources.length){details.append(Object.assign(document.createElement('div'),{textContent:'没有记录来源'}));return}sources.forEach((source,index)=>{const block=document.createElement('div');const label=document.createElement('strong');label.textContent=`Source ${index+1} · ${source.source_kind||source.evidence_type||'unknown'}`;block.append(label);const meta=document.createElement('div');meta.textContent=[source.source_label,source.source_locator,source.resolution].filter(Boolean).join(' · ');block.append(meta);const raw=document.createElement('pre');raw.textContent=source.excerpt||source.raw_content||'（无摘录）';block.append(raw);details.append(block)})}catch(error){details.textContent=error.message}}
    async function orgHistory(item,card){const existing=card.querySelector('.history-details');if(existing){existing.hidden=!existing.hidden;return}const details=orgDetails(card,'history-details');details.textContent='正在加载历史…';try{const data=await orgApi(`/api/v2/knowledge/${encodeURIComponent(item.id)}/history`);details.replaceChildren();const heading=document.createElement('h3');heading.textContent='修改历史';details.append(heading);const history=orgItems(data);if(!history.length){details.append(Object.assign(document.createElement('div'),{textContent:'暂无修改历史'}));return}const actionLabels={edit:'编辑',deactivate:'删除',restore:'恢复',move:'调整归属'};history.forEach(entry=>{const block=document.createElement('div');const label=document.createElement('strong');label.textContent=`${actionLabels[entry.action]||entry.action||'变更'} · ${orgDate(entry.created_at)}`;block.append(label);const before=document.createElement('pre');before.textContent=`旧：${JSON.stringify(entry.before_json||{},null,2)}`;block.append(before);const after=document.createElement('pre');after.textContent=`新：${JSON.stringify(entry.after_json||{},null,2)}`;block.append(after);details.append(block)})}catch(error){details.textContent=error.message}}
    function orgEdit(item,card){const editor=document.createElement('div');editor.className='knowledge-editor';const label=document.createElement('label');label.textContent='知识内容';const textarea=document.createElement('textarea');textarea.value=String(item.content||'');textarea.maxLength=12000;const entityLabel=document.createElement('label');entityLabel.textContent='归属 Entity';const select=document.createElement('select');const unorganized=document.createElement('option');unorganized.value='';unorganized.textContent='未整理';select.append(unorganized);for(const entity of orgEntityOptions(orgState.tree)){const option=document.createElement('option');option.value=String(entity.id);option.textContent=`${entity.name||'未命名实体'} · ${entity.entity_type||'concept'}`;select.append(option)}select.value=item.entity_id==null?'':String(item.entity_id);const actions=document.createElement('div');actions.className='editor-actions';const save=orgButton('保存',async()=>{save.disabled=true;try{await orgApi(`/api/v2/knowledge/${encodeURIComponent(item.id)}`,{method:'PATCH',body:JSON.stringify({content:textarea.value,entity_id:select.value?Number(select.value):null})});await orgLoad()}catch(error){org$('error').textContent=error.message;org$('error').hidden=false;save.disabled=false}},'primary');const cancel=orgButton('取消',()=>orgRender(orgState.all));actions.append(save,cancel);editor.append(label,textarea,entityLabel,select,actions);card.replaceChildren(editor);textarea.focus()}
    async function orgDelete(item){if(!window.confirm('确认删除这条知识？'))return;try{await orgApi(`/api/v2/knowledge/${encodeURIComponent(item.id)}`,{method:'DELETE'});await orgLoad()}catch(error){org$('error').textContent=error.message;org$('error').hidden=false}}
    async function orgRestore(item){try{await orgApi(`/api/v2/knowledge/${encodeURIComponent(item.id)}/restore`,{method:'POST'});await orgLoad()}catch(error){org$('error').textContent=error.message;org$('error').hidden=false}}
    async function orgPrune(node){const descendantCount=orgDescendantCount(node);if(!window.confirm(`确认删除空结构“${node.name||'未命名实体'}”？${descendantCount?`其下还有 ${descendantCount} 个空节点，将一起停用。`:''}`))return;try{await orgApi(`/api/v2/entities/${encodeURIComponent(node.id)}/prune`,{method:'POST',body:JSON.stringify({})});orgState.selected=null;await orgLoad()}catch(error){org$('error').textContent=error.message;org$('error').hidden=false}}
    function orgRender(list){org$('summary').textContent=`${list.length} 条${orgState.active?'知识':'已删除知识'}`;const box=org$('knowledge-list');box.replaceChildren();if(!list.length){box.innerHTML=`<div class="empty">${orgState.active?'没有找到匹配的知识。':'没有已删除的知识。'}</div>`;return}for(const item of list){const trust=String(orgText(item,'trust','status')||'').toLowerCase(),card=document.createElement('article');card.className='card';const title=document.createElement('h2');title.textContent=orgText(item,'title','name')||'未命名知识';const entity=document.createElement('div');entity.className='entity';entity.textContent=orgText(item,'entity_display_name')||orgText(item,'entity_name','entity','model')||'未整理';const content=document.createElement('p');content.textContent=orgText(item,'content','text','answer')||'暂无内容';const meta=document.createElement('div');meta.className='meta';const badge=document.createElement('span');badge.className=`trust ${orgEscape(trust)}`;badge.textContent=orgTrust(trust);const date=document.createElement('span');date.textContent=orgDate(orgText(item,'updated_at','created_at'));meta.append(badge,date);const actions=document.createElement('div');actions.className='knowledge-actions';if(orgState.active){actions.append(orgButton('编辑',()=>orgEdit(item,card)),orgButton('删除',()=>orgDelete(item),'danger'))}else{actions.append(orgButton('恢复',()=>orgRestore(item)))}actions.append(orgButton('来源',()=>orgSources(item,card)),orgButton('历史',()=>orgHistory(item,card)));card.append(title,entity,content,meta,actions);box.append(card)}}
    function orgQuery(){const params=new URLSearchParams({active:String(orgState.active),q:org$('search').value.trim()});if(orgState.selected!=null)return `/api/v2/knowledge?entity_id=${encodeURIComponent(orgState.selected)}&${params}`;return `/api/v2/knowledge?${params}`}
    async function orgSelect(entityId){orgState.selected=entityId;orgMarkSelected();try{orgState.all=orgItems(await orgApi(orgQuery()));orgRender(orgState.all)}catch(error){org$('error').textContent=error.message;org$('error').hidden=false}}
    async function orgLoad(){try{org$('error').hidden=true;const data=await orgApi(orgQuery());orgState.tree=data.tree||{roots:[],unorganized:[]};orgState.all=orgItems(data);orgTree(orgState.tree);orgRender(orgState.all);org$('active-view').classList.toggle('active',orgState.active);org$('deleted-view').classList.toggle('active',!orgState.active)}catch(error){org$('error').textContent=error.message;org$('error').hidden=false;org$('entity-tree').innerHTML='<div class="empty">暂时无法加载实体结构。</div>';org$('knowledge-list').innerHTML='<div class="empty">暂时无法加载知识。</div>'}}
    function orgSetView(active){orgState.active=active;orgState.selected=null;orgLoad()}org$('active-view').onclick=()=>orgSetView(true);org$('deleted-view').onclick=()=>orgSetView(false);org$('search').addEventListener('input',()=>{clearTimeout(orgState.searchTimer);orgState.searchTimer=setTimeout(orgLoad,250)});org$('clear').onclick=()=>{org$('search').value='';orgLoad()};org$('refresh').onclick=orgLoad;orgLoad();
  </script>
</body>
