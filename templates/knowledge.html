<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge · aihelper V2</title>
  <style>
    :root{--bg:#f6f7f9;--panel:#fff;--line:#e5e7eb;--text:#17212b;--muted:#667085;--blue:#2563eb;--blue-soft:#eff6ff;--green:#15803d;--amber:#b45309;--red:#b42318;--shadow:0 1px 2px #1018280d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}.topbar{display:flex;align-items:center;gap:18px;min-height:60px;border-bottom:1px solid var(--line);background:#fff}.shell{max-width:1180px;margin:0 auto;padding:0 20px}.top-inner{display:flex;align-items:center;gap:18px;width:100%}.brand{font-weight:750;color:var(--text);text-decoration:none}.nav{display:flex;gap:4px}.nav a{color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:7px}.nav a:hover,.nav a.active{background:var(--blue-soft);color:var(--blue)}.keybox{display:flex;align-items:center;gap:7px;margin-left:auto;color:var(--muted);font-size:12px}.keybox input{width:170px;border:1px solid #cbd5e1;border-radius:7px;padding:7px 8px}.page{padding:24px 0 32px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:17px}.heading h1{font-size:25px;line-height:1.2;margin:0 0 4px}.heading p{margin:0;color:var(--muted)}.toolbar{display:flex;gap:9px;margin-bottom:15px}.toolbar input{flex:1;border:1px solid #cbd5e1;border-radius:8px;padding:9px 11px}.toolbar button{border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:8px 12px;cursor:pointer}.summary{color:var(--muted);font-size:12px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px;box-shadow:var(--shadow)}.card h2{font-size:16px;line-height:1.35;margin:0 0 6px}.card p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.entity{font-size:12px;color:var(--blue);margin-bottom:9px}.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:12px}.trust{padding:3px 7px;border-radius:99px;background:#eef2f6}.trust.official_source{background:#ecfdf3;color:var(--green)}.trust.user_confirmed{background:var(--blue-soft);color:var(--blue)}.trust.provisional{background:#fff7ed;color:var(--amber)}.trust.conflicted{background:#fff1f0;color:var(--red)}.sources{border-top:1px solid #edf0f3;margin-top:12px;padding-top:10px;color:var(--muted);font-size:12px}.empty{padding:55px 20px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:11px}.error{color:var(--red);background:#fff1f0;border:1px solid #fecaca;border-radius:8px;padding:9px 11px;margin-bottom:12px}@media(max-width:720px){.shell{padding:0 10px}.topbar{padding:10px 0}.top-inner{flex-wrap:wrap;gap:8px}.keybox{width:100%;margin-left:0}.keybox input{flex:1}.heading{display:block}.heading button{margin-top:10px}}
  </style>
<style>
  .nav { overflow-x: auto; }
  .nav a { white-space: nowrap; }
  .key-settings{margin-left:auto;color:var(--muted);font-size:12px;position:relative}.key-settings summary{cursor:pointer;list-style:none;padding:7px 9px;border:1px solid transparent;border-radius:8px;white-space:nowrap}.key-settings summary::-webkit-details-marker{display:none}.key-settings summary::after{content:'⌄';margin-left:5px}.key-settings[open] summary{border-color:#cbd5e1;background:#f8fafc}.key-panel{position:absolute;right:0;top:calc(100% + 6px);z-index:2;display:grid;grid-template-columns:auto minmax(150px,1fr) auto;align-items:center;gap:8px;width:min(360px,calc(100vw - 20px));padding:10px;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 22px #1018281a}.key-panel input{min-width:0;border:1px solid #cbd5e1;border-radius:7px;padding:7px 8px}.key-panel input:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}
</style>
</head>
<body>
  <header class="topbar"><div class="shell top-inner"><a class="brand" href="/inbox">aihelper V2</a><nav class="nav" aria-label="主导航"><a href="/inbox">Inbox</a><a class="active" href="/knowledge">Knowledge</a><a href="/documents">Documents</a></nav><details class="key-settings" id="key-settings"><summary>设置 <span id="key-status">未设置</span></summary><div class="key-panel"><label for="api-key">API Key</label><input id="api-key" type="password" autocomplete="off" placeholder="输入后保存"><button id="save-key" type="button">保存</button></div></details></div></header>
  <main class="shell page"><div class="heading"><div><h1>Knowledge</h1><p>这里保留已确认和正在学习的产品知识。</p></div><button id="refresh" type="button">刷新</button></div><div class="toolbar"><input id="search" type="search" placeholder="搜索产品、型号或内容"><button id="clear" type="button">清除</button></div><div id="error" class="error" hidden></div><div id="summary" class="summary"></div><section id="knowledge-list" class="grid"><div class="empty">正在加载…</div></section></main>
  <script>
    const $=id=>document.getElementById(id),key=$('api-key');key.value=sessionStorage.getItem('x-api-key')||'';function saveKey(){const clean=key.value.trim();sessionStorage.setItem('x-api-key',clean);$('key-status').textContent=clean?'已保存':'未设置'}saveKey();$('save-key').addEventListener('click',()=>{saveKey();$('key-settings').open=false;load()});key.addEventListener('keydown',event=>{if(event.key==='Enter')$('save-key').click()});const headers=json=>({'x-api-key':sessionStorage.getItem('x-api-key')||'',...(json?{'Content-Type':'application/json'}:{})});async function api(path,options={}){if(!sessionStorage.getItem('x-api-key')){$('key-settings').open=true;key.focus();throw Error('请先在设置中保存 API Key')}let r;try{r=await fetch(path,{...options,headers:{...headers(Boolean(options.body)),...(options.headers||{})}})}catch(_){throw Error('无法连接服务，请确认 API 已启动')}let d={};try{d=await r.json()}catch(_){ }if(!r.ok)throw Error(d.detail||d.message||`请求失败（${r.status}）`);return d}function items(data){if(Array.isArray(data))return data;if(!data||typeof data!=='object')return [];const result=data.items||data.knowledge||data.results||[];return Array.isArray(result)?result:[]}function text(item,...keys){for(const key of keys)if(item&&item[key]!=null)return item[key];return ''}function displayDate(raw){if(!raw)return '';const date=new Date(raw);return Number.isNaN(date.getTime())?String(raw):date.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}function trustLabel(trust){return {official_source:'官方资料',user_confirmed:'用户确认',provisional:'待确认',conflicted:'存在冲突'}[trust]||trust||'未标记'}function showSources(sources,count){const list=sources==null||sources===''?[]:Array.isArray(sources)?sources:[sources],labels=list.map(source=>typeof source==='string'?source:text(source,'title','name','label','filename')).filter(Boolean).map(String);if(!labels.length&&count==null)return '';return `<div class="sources">来源：${labels.length?labels.map(escape).join('、'):`${Number(count)||0} 条原始来源`}</div>`}function escape(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(list){const query=$('search').value.trim().toLowerCase(),filtered=list.filter(item=>!query||JSON.stringify(item).toLowerCase().includes(query));$('summary').textContent=`${filtered.length} 条知识`;$('knowledge-list').replaceChildren();if(!filtered.length){$('knowledge-list').innerHTML='<div class="empty">没有找到匹配的知识。</div>';return}for(const item of filtered){const trust=String(text(item,'trust','status')||'').toLowerCase(),card=document.createElement('article');card.className='card';card.innerHTML=`<h2>${escape(text(item,'title','name')||'未命名知识')}</h2><div class="entity">${escape(text(item,'entity_name','entity','model')||'产品知识')}</div><p>${escape(text(item,'content','text','answer')||'暂无内容')}</p><div class="meta"><span class="trust ${escape(trust)}">${escape(trustLabel(trust))}</span><span>${escape(displayDate(text(item,'updated_at','created_at')))}</span></div>${showSources(text(item,'sources','source'),text(item,'source_count'))}`;$('knowledge-list').append(card)}}let all=[];async function load(){try{$('error').hidden=true;const data=await api('/api/v2/knowledge');all=items(data);render(all)}catch(e){$('error').textContent=e.message;$('error').hidden=false;$('knowledge-list').innerHTML='<div class="empty">暂时无法加载知识。</div>'}}$('search').addEventListener('input',()=>render(all));$('clear').onclick=()=>{$('search').value='';render(all)};$('refresh').onclick=load;load();
  </script>
</body>
</html>
