<style>
  .layout{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:15px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}.tree-panel{padding:14px;position:sticky;top:12px;max-height:calc(100vh - 120px);overflow:auto}.tree-panel h2{font-size:15px;margin:0 0 10px}.tree-group-title{color:var(--muted);font-size:12px;margin:10px 0 5px}.tree-node{display:block;margin:2px 0}.tree-node summary{cursor:pointer;list-style:none;border-radius:7px;padding:5px 7px}.tree-node summary::-webkit-details-marker{display:none}.tree-node summary:hover,.tree-node summary.selected{background:var(--blue-soft);color:var(--blue)}.tree-node summary::before{content:'›';display:inline-block;width:17px;color:var(--muted);transition:transform .15s}.tree-node[open]>summary::before{transform:rotate(90deg)}.tree-node.leaf>summary::before{content:'·';font-weight:700}.tree-label{display:inline-flex;justify-content:space-between;gap:8px;width:calc(100% - 17px);vertical-align:top}.tree-count{color:var(--muted);font-size:11px}.tree-children{padding-left:16px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}.tree-panel{position:static;max-height:310px}}

  <script>
    const $=id=>document.getElementById(id),key=$('api-key');key.value=sessionStorage.getItem('x-api-key')||'';function saveKey(){const clean=key.value.trim();sessionStorage.setItem('x-api-key',clean);$('key-status').textContent=clean?'已保存':'未设置'}saveKey();$('save-key').addEventListener('click',()=>{saveKey();$('key-settings').open=false;load()});key.addEventListener('keydown',event=>{if(event.key==='Enter')$('save-key').click()});const headers=json=>({'x-api-key':sessionStorage.getItem('x-api-key')||'',...(json?{'Content-Type':'application/json'}:{})});async function api(path,options={}){if(!sessionStorage.getItem('x-api-key')){$('key-settings').open=true;key.focus();throw Error('请先在设置中保存 API Key')}let r;try{r=await fetch(path,{...options,headers:{...headers(Boolean(options.body)),...(options.headers||{})}})}catch(_){throw Error('无法连接服务，请确认 API 已启动')}let d={};try{d=await r.json()}catch(_){ }if(!r.ok)throw Error(d.detail||d.message||`请求失败（${r.status}）`);return d}function items(data){if(Array.isArray(data))return data;if(!data||typeof data!=='object')return [];const result=data.items||data.knowledge||data.results||[];return Array.isArray(result)?result:[]}function text(item,...keys){for(const key of keys)if(item&&item[key]!=null)return item[key];return ''}function displayDate(raw){if(!raw)return '';const date=new Date(raw);return Number.isNaN(date.getTime())?String(raw):date.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}function trustLabel(trust){return {official_source:'官方资料',user_confirmed:'用户确认',provisional:'待确认',conflicted:'存在冲突'}[trust]||trust||'未标记'}function showSources(sources,count){const list=sources==null||sources===''?[]:Array.isArray(sources)?sources:[sources],labels=list.map(source=>typeof source==='string'?source:text(source,'title','name','label','filename')).filter(Boolean).map(String);if(!labels.length&&count==null)return '';return `<div class="sources">来源：${labels.length?labels.map(escape).join('、'):`${Numbe   <script>
    const org$=id=>document.getElementById(id);
    const orgKey=org$('api-key');
    function orgStoredKey(){return sessionStorage.getItem('x-api-key')||''}
    orgKey.value=orgStoredKey();
    function orgSaveKey(){const clean=orgKey.value.trim();sessionStorage.setItem('x-api-key',clean);org$('key-status').textContent=clean?'已保存':'未设置'}
    orgSaveKey();
    org$('save-key').addEventListener('click',()=>{orgSaveKey();org$('key-settings').open=false;orgLoad()});
    orgKey.addEventListener('keydown',event=>{if(event.key==='Enter')org$('save-key').click()});
    async function orgApi(path){if(!orgStoredKey()){org$('key-settings').open=true;orgKey.focus();throw Error('请先在设置中保存 API Key')}let response;try{response=await fetch(path,{cache:'no-store',headers:{'x-api-key':orgStoredKey()}})}catch(_){throw Error('无法连接服务，请确认 API 已启动')}let data={};try{data=await response.json()}catch(_){ }if(!response.ok)throw Error(data.detail||data.message||`请求失败（${response.status}）`);return data}
    function orgItems(data){if(Array.isArray(data))return data;if(!data||typeof data!=='object')return [];const result=data.items||data.knowledge||data.results||[];return Array.isArray(result)?result:[]}
    function orgText(item,...keys){for(const key of keys)if(item&&item[key]!=null)return item[key];return ''}
    function orgEscape(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function orgDate(raw){if(!raw)return '';const date=new Date(raw);return Number.isNaN(date.getTime())?String(raw):date.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
    function orgTrust(trust){return {official_source:'官方资料',user_confirmed:'用户确认',provisional:'待确认',conflicted:'存在冲突'}[trust]||trust||'未标记'}
    function sourceLabels(sources){if(sources==null||sources==='')return [];const list=Array.isArray(sources)?sources:[sources];return list.map(source=>typeof source==='string'?source:orgText(source,'title','name','label','filename')).filter(Boolean).map(String)}
    function showSources(sources,count){const list=sources==null||sources===''?[]:Array.isArray(sources)?sources:[sources];const labels=sourceLabels(list);if(!labels.length&&count==null)return '';return `<div class="sources">来源：${labels.length?labels.map(orgEscape).join('、'):`${Number(count)||0} 条原始来源`}</div>`}
    const orgState={all:[],tree:{roots:[],unorganized:[]},selected:null};
    function orgNode(node,depth=0){if(!node||node.id==null)return null;const details=document.createElement('details');details.className='tree-node'+(node.children&&node.children.length?'':' leaf');details.open=depth<1;const summary=document.createElement('summary');if(String(node.id)===String(orgState.selected))summary.classList.add('selected');const label=document.createElement('span');label.className='tree-label';label.innerHTML=`<span>${orgEscape(node.name||'未命名实体')}</span><span class="tree-count">${Number(node.knowledge_count)||0}</span>`;summary.append(label);summary.onclick=event=>{event.preventDefault();orgSelect(node.id)};details.append(summary);if(node.children&&node.children.length){const children=document.createElement('div');children.className='tree-children';for(const child of node.children){const rendered=orgNode(child,depth+1);if(rendered)children.append(rendered)}details.append(children)}return details}
    function orgTree(tree){const box=org$('entity-tree');box.replaceChildren();const roots=Array.isArray(tree&&tree.roots)?tree.roots:[],orphans=Array.isArray(tree&&tree.unorganized)?tree.unorganized:[];if(!roots.length&&!orphans.length){box.innerHTML='<div class="empty">还没有实体结构。</div>';return}for(const node of roots){const rendered=orgNode(node);if(rendered)box.append(rendered)}if(orphans.length){const title=document.createElement('div');title.className='tree-group-title';title.textContent='未整理';box.append(title);for(const node of orphans){const rendered=orgNode(node);if(rendered)box.append(rendered)}}}
    function orgRender(list){const query=org$('search').value.trim().toLowerCase();const filtered=list.filter(item=>!query||JSON.stringify(item).toLowerCase().includes(query));org$('summary').textContent=`${filtered.length} 条知识`;const box=org$('knowledge-list');box.replaceChildren();if(!filtered.length){box.innerHTML='<div class="empty">没有找到匹配的知识。</div>';return}for(const item of filtered){const trust=String(orgText(item,'trust','status')||'').toLowerCase(),card=document.createElement('article');card.className='card';card.innerHTML=`<h2>${orgEscape(orgText(item,'title','name')||'未命名知识')}</h2><div class="entity">${orgEscape(orgText(item,'entity_name','entity','model')||'未整理')}</div><p>${orgEscape(orgText(item,'content','text','answer')||'暂无内容')}</p><div class="meta"><span class="trust ${orgEscape(trust)}">${orgEscape(orgTrust(trust))}</span><span>${orgEscape(orgDate(orgText(item,'updated_at','created_at')))}</span></div>${showSources(orgText(item,'sources','source'),orgText(item,'source_count'))}`;box.append(card)}}
    async function orgSelect(entityId){orgState.selected=entityId;orgTree(orgState.tree);try{orgState.all=orgItems(await orgApi(`/api/v2/knowledge?entity_id=${encodeURIComponent(entityId)}`));orgRender(orgState.all)}catch(error){org$('error').textContent=error.message;org$('error').hidden=false}}
    async function orgLoad(){try{org$('error').hidden=true;const data=await orgApi('/api/v2/knowledge');orgState.tree=data.tree||{roots:[],unorganized:[]};orgState.selected=null;orgState.all=orgItems(data);orgTree(orgState.tree);orgRender(orgState.all)}catch(error){org$('error').textContent=error.message;org$('error').hidden=false;org$('entity-tree').innerHTML='<div class="empty">暂时无法加载实体结构。</div>';org$('knowledge-list').innerHTML='<div class="empty">暂时无法加载知识。</div>'}}
    org$('search').addEventListener('input',()=>orgRender(orgState.all));org$('clear').onclick=()=>{org$('search').value='';orgRender(orgState.all)};org$('refresh').onclick=orgLoad;orgLoad();
  </script>
