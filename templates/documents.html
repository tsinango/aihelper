<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documents · aihelper V2</title>
  <style>
    :root{--bg:#f6f7f9;--panel:#fff;--line:#e5e7eb;--text:#17212b;--muted:#667085;--blue:#2563eb;--blue-soft:#eff6ff;--green:#15803d;--amber:#b45309;--red:#b42318;--shadow:0 1px 2px #1018280d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.topbar{min-height:60px;border-bottom:1px solid var(--line);background:#fff}.shell{max-width:1180px;margin:0 auto;padding:0 20px}.top-inner{display:flex;align-items:center;gap:18px;min-height:60px}.brand{font-weight:750;color:var(--text);text-decoration:none}.nav{display:flex;gap:4px}.nav a{color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:7px}.nav a:hover,.nav a.active{background:var(--blue-soft);color:var(--blue)}.keybox{display:flex;align-items:center;gap:7px;margin-left:auto;color:var(--muted);font-size:12px}.keybox input{width:170px;border:1px solid #cbd5e1;border-radius:7px;padding:7px 8px}.page{padding:24px 0 32px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:17px}.heading h1{font-size:25px;line-height:1.2;margin:0 0 4px}.heading p{margin:0;color:var(--muted)}.heading button,.filter button{border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:8px 12px;cursor:pointer}.filter{display:flex;gap:9px;margin-bottom:15px}.filter input{flex:1;border:1px solid #cbd5e1;border-radius:8px;padding:9px 11px}.error{color:var(--red);background:#fff1f0;border:1px solid #fecaca;border-radius:8px;padding:9px 11px;margin-bottom:12px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}table{border-collapse:collapse;width:100%;min-width:640px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid #edf0f3;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:650;background:#fafbfc}tr:last-child td{border-bottom:0}.name{font-weight:650}.muted{color:var(--muted);font-size:12px}.status{display:inline-block;padding:3px 8px;border-radius:99px;background:#eef2f6;color:var(--muted);font-size:12px}.status.ready,.status.completed,.status.available{background:#ecfdf3;color:var(--green)}.status.processing,.status.pending{background:#fff7ed;color:var(--amber)}.empty{padding:55px 20px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:11px}@media(max-width:720px){.shell{padding:0 10px}.top-inner{flex-wrap:wrap;height:auto;padding:10px 0;gap:8px}.keybox{width:100%;margin-left:0}.keybox input{flex:1}.heading{display:block}.heading button{margin-top:10px}}
  </style>
<style>
  .nav { overflow-x: auto; }
  .nav a { white-space: nowrap; }
  .key-settings { margin-left: auto; position: relative; }
  .key-settings summary { color: var(--muted); cursor: pointer; font-size: 12px; list-style: none; padding: 7px 9px; }
  .key-settings summary::-webkit-details-marker { display: none; }
  .key-panel { align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 8px 24px #1018281f; display: flex; gap: 7px; padding: 9px; position: absolute; right: 0; top: 38px; z-index: 10; }
  .key-panel input { border: 1px solid #cbd5e1; border-radius: 7px; padding: 7px 8px; width: 190px; }
  .key-panel button { background: var(--blue); border: 0; border-radius: 7px; color: #fff; cursor: pointer; padding: 7px 10px; }
  #key-status { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .card{background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);margin-bottom:14px}
  .card-head{padding:12px 15px;border-bottom:1px solid var(--line)}
  .card-body{padding:14px 15px}
  .upload-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .upload-row input,.upload-row select{border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;flex:1;min-width:160px}
  .upload-row button{border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:8px 12px;cursor:pointer}
  .upload-row button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .block-text{white-space:pre-wrap;overflow-wrap:anywhere;max-width:560px}
  @media(max-width:720px) { .key-settings { margin-left: 0; } .key-panel { left: 0; right: auto; } }
</style>
</head>
<body>
  <header class="topbar"><div class="shell top-inner"><a class="brand" href="/inbox">aihelper V2</a><nav class="nav" aria-label="主导航"><a href="/inbox">Inbox</a><a href="/knowledge">Knowledge</a><a class="active" href="/documents">Documents</a><a href="/chat">Chat</a></nav><details class="key-settings" id="key-settings"><summary>设置</summary><div class="key-panel"><label for="api-key">API Key</label><input id="api-key" type="password" autocomplete="off" placeholder="仅保存在当前会话"><button id="save-key" type="button">保存</button><span id="key-status">未设置</span></div></details></div></header>
  <main class="shell page"><div class="heading"><div><h1>Documents</h1><p>原始产品资料会保留在这里，方便回到来源。PDF / PPTX 上传后进入 V2 结构解析。</p></div><button id="refresh" type="button">刷新</button></div><div id="error" class="error" hidden></div>
  <section class="card"><div class="card-head"><strong>上传 PDF / PPTX（V2 结构解析）</strong></div><div class="card-body">
    <div class="upload-row"><input id="file" type="file" accept=".pdf,.pptx" aria-label="PDF 或 PPTX 文件"></div>
    <div class="upload-row"><input id="doc-key" placeholder="document_key（同一手册的版本组，必填）" aria-label="document_key"><input id="doc-label" placeholder="version_label（默认取文件名）" aria-label="version_label"></div>
    <div class="upload-row"><input id="doc-title" placeholder="标题（可选）" aria-label="标题"><select id="doc-auth" aria-label="来源真实性"><option value="unverified">来源未核实</option><option value="official_vendor">厂商官方</option><option value="confirmed_copy">已核对副本</option></select><button id="upload" class="primary" type="button">上传并解析</button></div>
    <div id="upload-status" class="muted"></div>
  </div></section>
  <section class="card"><div class="card-head"><strong>V2 版本</strong><span class="muted"> · 解析状态与结构定位（图片页会明确标出）</span></div><div id="versions"><div class="empty">正在加载…</div></div></section>
  <section class="card" id="version-detail" hidden><div class="card-head"><strong id="detail-title">版本详情</strong></div><div class="card-body"><div id="detail-meta" class="muted"></div><div id="coverage" class="muted"></div><div class="upload-row"><button id="download" type="button">下载原文件</button><button id="learn-start" type="button">开始学习（按小节提炼）</button><button id="job-retry" type="button" hidden>重试任务</button></div><div class="upload-row"><select id="impact-previous" aria-label="旧版本"></select><button id="impact-compare" type="button">对比旧版</button><button id="impact-revalidate" type="button" title="把当前版本记为所选旧版的新版并保存差异">设为新版并记录</button></div><div id="impact" class="muted"></div><div id="proposals"></div><div id="blocks"></div></div></section>
  <section class="card"><div class="card-head"><strong>旧资料（只读）</strong></div><div class="card-body"><div class="filter"><input id="search" type="search" placeholder="搜索文件名、产品或版本"><button id="clear" type="button">清除</button></div><section id="documents"><div class="empty">正在加载…</div></section></div></section></main>
  <script>
    const $=id=>document.getElementById(id),key=$('api-key');key.value=sessionStorage.getItem('x-api-key')||'';function saveKey(){const clean=key.value.trim();sessionStorage.setItem('x-api-key',clean);$('key-status').textContent=clean?'已保存':'未设置'}saveKey();$('save-key').addEventListener('click',()=>{saveKey();$('key-settings').open=false;load()});const headers=()=>({'x-api-key':sessionStorage.getItem('x-api-key')||''});async function api(path,options){if(!sessionStorage.getItem('x-api-key')){$('key-settings').open=true;throw Error('请先在设置中保存 API Key')}let r;try{r=await fetch(path,{headers:headers(),...(options||{})})}catch(_){throw Error('无法连接服务，请确认 API 已启动')}let d={};try{d=await r.json()}catch(_){ }if(!r.ok)throw Error(d.detail||d.message||`请求失败（${r.status}）`);return d}function items(data){if(Array.isArray(data))return data;if(!data||typeof data!=='object')return [];const result=data.items||data.documents||data.results||[];return Array.isArray(result)?result:[]}function text(item,...keys){for(const key of keys)if(item&&item[key]!=null)return item[key];return ''}function displayDate(raw){if(!raw)return '—';const date=new Date(raw);return Number.isNaN(date.getTime())?String(raw):date.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(list){const q=$('search').value.trim().toLowerCase(),filtered=list.filter(item=>!q||JSON.stringify(item).toLowerCase().includes(q));if(!filtered.length){$('documents').innerHTML='<div class="empty">没有找到资料。</div>';return}const table=document.createElement('div');table.className='table-wrap';table.innerHTML='<table><thead><tr><th>资料</th><th>版本</th><th>产品</th><th>状态</th><th>更新时间</th></tr></thead><tbody></tbody></table>';const body=table.querySelector('tbody');for(const item of filtered){const tr=document.createElement('tr');const name=text(item,'title','filename','name')||'未命名资料';const status=String(text(item,'status')||'').toLowerCase();tr.innerHTML=`<td><div class="name">${esc(name)}</div><div class="muted">${esc(text(item,'filename','file_name')||'')}</div></td><td>${esc(text(item,'version','document_version')||'—')}</td><td>${esc(text(item,'product_model','model','entity_name')||'—')}</td><td><span class="status ${esc(status)}">${esc(text(item,'status_label','status')||'已接收')}</span></td><td class="muted">${esc(displayDate(text(item,'updated_at','created_at')))}</td>`;body.append(tr)}$('documents').replaceChildren(table)}let all=[];async function load(){try{$('error').hidden=true;const data=await api('/api/v2/documents');all=items(data);render(all);renderVersions(Array.isArray(data.versions)?data.versions:[])}catch(e){$('error').textContent=e.message;$('error').hidden=false;$('documents').innerHTML='<div class="empty">暂时无法加载资料。</div>'}}$('search').addEventListener('input',()=>render(all));$('clear').onclick=()=>{$('search').value='';render(all)};$('refresh').onclick=load;
    function position(block){if(block.slide_no!=null)return `slide ${block.slide_no}`;if(block.page_no!=null)return `page ${block.page_no}`;return '—'}
    function renderVersions(versions){allVersions=Array.isArray(versions)?versions:[];const box=$('versions');if(!allVersions.length){box.innerHTML='<div class="empty">还没有 V2 版本，上传 PDF / PPTX 后会出现在这里。</div>';return}const wrap=document.createElement('div');wrap.className='table-wrap';wrap.innerHTML='<table><thead><tr><th>版本组 / 标签</th><th>类型</th><th>状态</th><th>结构块</th><th>更新时间</th><th></th></tr></thead><tbody></tbody></table>';const body=wrap.querySelector('tbody');for(const item of allVersions){const tr=document.createElement('tr');const status=String(item.status||'').toLowerCase();tr.innerHTML=`<td><div class="name">${esc(text(item,'document_key')||'—')}</div><div class="muted">${esc(text(item,'version_label')||'')}${esc(text(item,'title')?' · '+text(item,'title'):'')}</div></td><td>${esc(text(item,'file_type')||'—')}</td><td><span class="status ${esc(status)}">${esc(text(item,'status')||'—')}</span></td><td>${esc(text(item,'block_count')??'—')}</td><td class="muted">${esc(displayDate(text(item,'updated_at','created_at')))}</td><td></td>`;const btn=document.createElement('button');btn.type='button';btn.textContent='查看';btn.onclick=()=>showVersion(item.version_id);tr.lastChild.append(btn);body.append(tr)}box.replaceChildren(wrap)}
    let currentVersion=null,currentJobId=null,pollTimer=0,allVersions=[];
    async function showVersion(versionId){clearTimeout(pollTimer);try{const data=await api(`/api/v2/documents/versions/${encodeURIComponent(versionId)}/blocks`);currentVersion=data.version;currentJobId=data.parse_job?data.parse_job.job_id:null;const job=data.parse_job;$('job-retry').hidden=!(job&&job.status==='failed');fillPreviousOptions();$('version-detail').hidden=false;$('detail-title').textContent=`${text(data.version,'document_key')} / ${text(data.version,'version_label')}`;$('detail-meta').textContent=`${text(data.version,'file_name')} · ${text(data.version,'file_type')} · 状态 ${text(data.version,'status')} · 解析器 ${text(data.version,'parser_version')} · 共 ${data.total} 块${job?` · 任务 ${job.status}${job.error?' · '+job.error:''}`:''}`;renderBlocks(Array.isArray(data.items)?data.items:[]);renderProposals(versionId);renderCoverage(versionId);$('version-detail').scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){$('error').textContent=e.message;$('error').hidden=false}}
    async function renderCoverage(versionId){const box=$('coverage');try{const data=await api(`/api/v2/documents/versions/${encodeURIComponent(versionId)}/coverage`);const states=data.by_state||{};const parts=Object.keys(states).sort().map(k=>`${k}:${states[k]}`);box.textContent=`覆盖 ${data.with_destination||0}/${data.total_blocks||0} 块有去向${data.complete?' · 处理完毕（每段有去向，非理解正确率）':''} · ${parts.join(' ')} · 未完成 ${Array.isArray(data.unfinished_blocks)?data.unfinished_blocks.length:0} 块`}catch(e){box.textContent=''}}
    async function renderProposals(versionId){const box=$('proposals');box.innerHTML='<div class="muted">正在加载提案…</div>';let items=[];try{const data=await api(`/api/v2/documents/versions/${encodeURIComponent(versionId)}/proposals`);items=Array.isArray(data.items)?data.items:[]}catch(e){box.innerHTML='';return}if(!items.length){box.innerHTML='<div class="muted">暂无提炼提案。点“开始学习”后，后台按小节逐个提炼完整技术单元。</div>';return}box.replaceChildren();const head=document.createElement('div');head.innerHTML=`<strong>待确认技术单元（${items.length}）</strong>`;box.append(head);for(const item of items){const card=document.createElement('div');card.className='table-wrap';card.style.marginTop='8px';const details=item.details||{};const steps=Array.isArray(details.ordered_steps)?details.ordered_steps:[];card.innerHTML=`<div style="padding:10px 12px"><div class="name">${esc(text(details,'title')||'未命名单元')} · ${esc(text(item,'unit_kind'))} · ${esc(text(item,'status'))}${item.confirmed_knowledge_id?` · K${esc(item.confirmed_knowledge_id)}`:''}</div><div class="block-text"></div>${steps.length?`<div class="muted">步骤：${steps.map((s,i)=>`${i+1}. ${esc(String(s))}`).join('<br>')}</div>`:''}<div class="muted">来源块：${(Array.isArray(details.sources)?details.sources:[]).map(s=>esc(s.block_id)).join(', ')}</div></div>`;card.querySelector('.block-text').textContent=String(item.fact_text||'').slice(0,600);if(item.status==='pending_confirmation'){const row=document.createElement('div');row.className='upload-row';row.style.padding='0 12px 10px';const edit=document.createElement('textarea');edit.style.cssText='width:100%;min-height:70px;border:1px solid #cbd5e1;border-radius:8px;padding:8px';edit.value=String(item.fact_text||'');edit.setAttribute('aria-label','确认文本，可编辑');const btn=document.createElement('button');btn.type='button';btn.className='primary';btn.textContent='确认保存为 Knowledge';btn.onclick=()=>confirmProposal(item.proposal_id,edit.value,btn);row.append(edit,btn);card.append(row)}box.append(card)}}
    async function confirmProposal(proposalId,content,btn){btn.disabled=true;try{const data=await api(`/api/v2/document-proposals/${encodeURIComponent(proposalId)}/confirm`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:content.trim()||null})});$('upload-status').textContent=`已确认为 K${data.knowledge_id}（validated，可回答）${data.duplicate?' · 幂等命中':''}。`;if(currentVersion)showVersion(currentVersion.version_id);load()}catch(e){$('error').textContent=e.message;$('error').hidden=false;btn.disabled=false}}
    $('learn-start').onclick=async()=>{if(!currentVersion)return;try{const data=await api(`/api/v2/documents/versions/${encodeURIComponent(currentVersion.version_id)}/learn`,{method:'POST'});$('upload-status').textContent=`已排队 ${data.total} 个小节提炼任务，后台逐个执行，Inbox 优先。`;showVersion(currentVersion.version_id)}catch(e){$('error').textContent=e.message;$('error').hidden=false}};
    function renderBlocks(blocks){const box=$('blocks');if(!blocks.length){box.innerHTML='<div class="empty">该版本暂无结构块。</div>';return}const wrap=document.createElement('div');wrap.className='table-wrap';wrap.innerHTML='<table><thead><tr><th>#</th><th>位置</th><th>类型</th><th>处理状态</th><th>内容 / 说明</th></tr></thead><tbody></tbody></table>';const body=wrap.querySelector('tbody');for(const block of blocks){const tr=document.createElement('tr');const excerpt=String(block.evidence_text||'').slice(0,220);const assets=Array.isArray(block.assets)?block.assets:[];const note=block.state_reason||assets.map(a=>`${a.kind||'asset'}:${a.interpretation_status||''}`).join('、');tr.innerHTML=`<td class="muted">${esc(text(block,'ord'))}</td><td>${esc(position(block))}</td><td>${esc(text(block,'block_type'))}</td><td><span class="status ${esc(String(block.processing_state||'').toLowerCase())}">${esc(text(block,'processing_state'))}</span><div class="muted">${esc(note)}</div></td>`;const td=document.createElement('td');td.className='block-text';td.textContent=excerpt||'（无可提取文本）';tr.append(td);body.append(tr)}box.replaceChildren(wrap)}
    async function pollJob(jobId){clearTimeout(pollTimer);currentJobId=jobId;let job={};try{job=await api(`/api/v2/document-jobs/${encodeURIComponent(jobId)}`)}catch(e){$('upload-status').textContent=e.message;return}const status=String(job.status||'');$('upload-status').textContent=`解析任务 ${jobId}：${status}${job.error?' · '+job.error:''}${job.result_summary&&job.result_summary.blocks!=null?` · ${job.result_summary.blocks} 块/${job.result_summary.needs_review||0} 待人工`:''}`;if(status==='queued'||status==='processing'){pollTimer=setTimeout(()=>pollJob(jobId),3000)}else{load();if(currentVersion)showVersion(currentVersion.version_id)}}
    $('upload').onclick=async()=>{const files=$('file').files;if(!files||!files.length){$('upload-status').textContent='请先选择 PDF 或 PPTX 文件。';return}const key=$('doc-key').value.trim();if(!key){$('upload-status').textContent='请填写 document_key（同一手册的版本组）。';return}const form=new FormData();form.append('file',files[0]);form.append('document_key',key);form.append('version_label',$('doc-label').value.trim());form.append('title',$('doc-title').value.trim());form.append('source_authenticity',$('doc-auth').value);$('upload-status').textContent='正在上传…';try{if(!sessionStorage.getItem('x-api-key')){$('key-settings').open=true;throw Error('请先在设置中保存 API Key')}const r=await fetch('/api/v2/documents',{method:'POST',headers:{'x-api-key':sessionStorage.getItem('x-api-key')||''},body:form});let d={};try{d=await r.json()}catch(_){ }if(!r.ok)throw Error(d.detail||d.message||`请求失败（${r.status}）`);if(d.created){$('upload-status').textContent=`已上传为版本 ${d.version_id}，等待后台解析…`;if(d.parse_job_id)pollJob(d.parse_job_id);else load()}else{$('upload-status').textContent=`文件已存在（版本 ${d.version_id}，状态 ${d.status}）。`;load()}}catch(e){$('upload-status').textContent=e.message}};
    $('download').onclick=async()=>{if(!currentVersion)return;try{if(!sessionStorage.getItem('x-api-key')){$('key-settings').open=true;throw Error('请先在设置中保存 API Key')}const r=await fetch(`/api/v2/documents/versions/${encodeURIComponent(currentVersion.version_id)}/file`,{headers:{'x-api-key':sessionStorage.getItem('x-api-key')||''}});if(!r.ok)throw Error(`下载失败（${r.status}）`);const blob=await r.blob();const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=currentVersion.file_name||`v2-${currentVersion.version_id}`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),5000)}catch(e){$('error').textContent=e.message;$('error').hidden=false}};
    $('job-retry').onclick=async()=>{if(!currentJobId)return;try{await api(`/api/v2/document-jobs/${encodeURIComponent(currentJobId)}/retry`,{method:'POST'});$('upload-status').textContent=`任务 ${currentJobId} 已重新排队。`;pollJob(currentJobId)}catch(e){$('error').textContent=e.message;$('error').hidden=false}};
    function fillPreviousOptions(){const sel=$('impact-previous');sel.replaceChildren();for(const item of allVersions){if(!currentVersion||item.version_id===currentVersion.version_id)continue;if(item.document_key!==currentVersion.document_key)continue;const opt=document.createElement('option');opt.value=item.version_id;opt.textContent=`${item.version_label||item.version_id}`;sel.append(opt)}if(!sel.options.length){const opt=document.createElement('option');opt.value='';opt.textContent='（同组无其他版本）';sel.append(opt)}}
    async function compareImpact(record){const prev=$('impact-previous').value;if(!prev||!currentVersion)return;try{let data;if(record){data=await api(`/api/v2/documents/versions/${encodeURIComponent(currentVersion.version_id)}/revalidate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({previous_version_id:Number(prev)})});data={comparison:data.change_summary,affected_knowledge:(data.change_summary.affected_knowledge_ids||[]).map(id=>({knowledge_id:id}))}}else{data=await api(`/api/v2/documents/versions/${encodeURIComponent(currentVersion.version_id)}/impact?previous_version_id=${encodeURIComponent(prev)}`)}const comp=data.comparison||{};const secs=group=>((comp&&comp[group])||[]).map(s=>typeof s==='string'?s:(s.section||'')).join('、')||'无';$('impact').innerHTML=`新增小节：${esc(secs('added'))}<br>变化小节：${esc(secs('changed'))}<br>删除小节：${esc(secs('removed'))}<br>无法匹配：${esc(secs('unmatched'))}<br>全局范围变化：${comp.global_scope_changed?'是（保守影响全部派生单元）':'否'}<br>受影响 Knowledge：${(data.affected_knowledge||[]).map(a=>`K${esc(a.knowledge_id!==undefined?a.knowledge_id:a.id)}`).join('、')||'无'}${record?' · 已记录版本关系':''}`}catch(e){$('error').textContent=e.message;$('error').hidden=false}}
    $('impact-compare').onclick=()=>compareImpact(false);
    $('impact-revalidate').onclick=()=>compareImpact(true);
    load();
  </script>
</body>
</html>
