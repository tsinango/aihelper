<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documents · aihelper V2</title>
  <style>
    :root{--bg:#f6f7f9;--panel:#fff;--line:#e5e7eb;--text:#17212b;--muted:#667085;--blue:#2563eb;--blue-soft:#eff6ff;--green:#15803d;--amber:#b45309;--red:#b42318;--shadow:0 1px 2px #1018280d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.topbar{min-height:60px;border-bottom:1px solid var(--line);background:#fff}.shell{max-width:1180px;margin:0 auto;padding:0 20px}.top-inner{display:flex;align-items:center;gap:18px;min-height:60px}.brand{font-weight:750;color:var(--text);text-decoration:none}.nav{display:flex;gap:4px}.nav a{color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:7px}.nav a:hover,.nav a.active{background:var(--blue-soft);color:var(--blue)}.keybox{display:flex;align-items:center;gap:7px;margin-left:auto;color:var(--muted);font-size:12px}.keybox input{width:170px;border:1px solid #cbd5e1;border-radius:7px;padding:7px 8px}.page{padding:24px 0 32px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:17px}.heading h1{font-size:25px;line-height:1.2;margin:0 0 4px}.heading p{margin:0;color:var(--muted)}.heading button,.filter button{border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:8px 12px;cursor:pointer}.filter{display:flex;gap:9px;margin-bottom:15px}.filter input{flex:1;border:1px solid #cbd5e1;border-radius:8px;padding:9px 11px}.error{color:var(--red);background:#fff1f0;border:1px solid #fecaca;border-radius:8px;padding:9px 11px;margin-bottom:12px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}table{border-collapse:collapse;width:100%;min-width:640px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid #edf0f3;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:650;background:#fafbfc}tr:last-child td{border-bottom:0}.name{font-weight:650}.muted{color:var(--muted);font-size:12px}.status{display:inline-block;padding:3px 8px;border-radius:99px;background:#eef2f6;color:var(--muted);font-size:12px}.status.ready,.status.completed,.status.available{background:#ecfdf3;color:var(--green)}.status.processing,.status.pending{background:#fff7ed;color:var(--amber)}.empty{padding:55px 20px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:11px}@media(max-width:720px){.shell{padding:0 10px}.top-inner{flex-wrap:wrap;height:auto;padding:10px 0;gap:8px}.keybox{width:100%;margin-left:0}.keybox input{flex:1}.heading{display:block}.heading button{margin-top:10px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="shell top-inner"><a class="brand" href="/inbox">aihelper V2</a><nav class="nav" aria-label="主导航"><a href="/inbox">Inbox</a><a href="/knowledge">Knowledge</a><a class="active" href="/documents">Documents</a><a href="/chat">Chat</a></nav><label class="keybox">API Key <input id="api-key" type="password" autocomplete="off" placeholder="sessionStorage"><span id="key-status">未设置</span></label></div></header>
  <main class="shell page"><div class="heading"><div><h1>Documents</h1><p>原始产品资料会保留在这里，方便回到来源。</p></div><button id="refresh" type="button">刷新</button></div><div class="filter"><input id="search" type="search" placeholder="搜索文件名、产品或版本"><button id="clear" type="button">清除</button></div><div id="error" class="error" hidden></div><section id="documents"><div class="empty">正在加载…</div></section></main>
  <script>
    const $=id=>document.getElementById(id),key=$('api-key');key.value=sessionStorage.getItem('x-api-key')||'';function saveKey(){sessionStorage.setItem('x-api-key',key.value.trim());$('key-status').textContent=key.value.trim()?'已保存':'未设置'}saveKey();key.addEventListener('change',()=>{saveKey();load()});const headers=()=>({'x-api-key':sessionStorage.getItem('x-api-key')||''});async function api(path){const r=await fetch(path,{headers:headers()});let d={};try{d=await r.json()}catch(_){ }if(!r.ok)throw Error(d.detail||d.message||`请求失败（${r.status}）`);return d}function items(data){return Array.isArray(data)?data:(data.items||data.documents||data.results||[])}function text(item,...keys){for(const key of keys)if(item&&item[key]!=null)return item[key];return ''}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(list){const q=$('search').value.trim().toLowerCase(),filtered=list.filter(item=>!q||JSON.stringify(item).toLowerCase().includes(q));if(!filtered.length){$('documents').innerHTML='<div class="empty">没有找到资料。</div>';return}const table=document.createElement('div');table.className='table-wrap';table.innerHTML='<table><thead><tr><th>资料</th><th>版本</th><th>产品</th><th>状态</th><th>更新时间</th></tr></thead><tbody></tbody></table>';const body=table.querySelector('tbody');for(const item of filtered){const tr=document.createElement('tr');const name=text(item,'title','filename','name')||'未命名资料';tr.innerHTML=`<td><div class="name">${esc(name)}</div><div class="muted">${esc(text(item,'filename','file_name')||'')}</div></td><td>${esc(text(item,'version','document_version')||'—')}</td><td>${esc(text(item,'product_model','model','entity_name')||'—')}</td><td><span class="status ${esc(String(text(item,'status')||'').toLowerCase())}">${esc(text(item,'status_label','status')||'已接收')}</span></td><td class="muted">${esc(text(item,'updated_at','created_at')||'—')}</td>`;body.append(tr)}$('documents').replaceChildren(table)}let all=[];async function load(){try{$('error').hidden=true;const data=await api('/api/v2/documents');all=items(data);render(all)}catch(e){$('error').textContent=e.message;$('error').hidden=false;$('documents').innerHTML='<div class="empty">暂时无法加载资料。</div>'}}$('search').addEventListener('input',()=>render(all));$('clear').onclick=()=>{$('search').value='';render(all)};$('refresh').onclick=load;load();
  </script>
</body>
</html>
