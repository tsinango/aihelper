<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Inbox · aihelper</title>
  <style>
    :root{--bg:#f6f7f9;--panel:#fff;--line:#e5e7eb;--text:#17212b;--muted:#667085;--blue:#2563eb;--blue-soft:#eff6ff;--amber:#b45309;--red:#b42318}
    [hidden]{display:none!important}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
    button,input,textarea{font:inherit}
    button{border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--text);padding:9px 13px;cursor:pointer;min-height:40px}
    button:disabled{opacity:.55;cursor:not-allowed}
    .primary{background:var(--blue);border-color:var(--blue);color:#fff}
    .topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);flex:none}
    .brand{font-weight:750;color:var(--text);text-decoration:none;white-space:nowrap}
    .stats{display:flex;gap:12px;flex-wrap:wrap;min-width:0;color:var(--muted);font-size:12px;flex:1}
    .stats strong{color:var(--text);font-weight:650}
    .top-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
    .nav{display:flex;gap:4px;min-width:0;overflow-x:auto}
    .nav a{color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:7px;white-space:nowrap}
    .nav a:hover,.nav a.active{background:var(--blue-soft);color:var(--blue)}
    .key-settings{color:var(--muted);font-size:12px;position:relative}
    .key-settings summary{cursor:pointer;list-style:none;padding:7px 9px;border:1px solid transparent;border-radius:9px;white-space:nowrap;min-height:40px}
    .key-settings summary::-webkit-details-marker{display:none}
    .key-settings summary::after{content:'⌄';margin-left:4px}
    .key-settings[open] summary{border-color:#cbd5e1;background:#f8fafc}
    .key-panel{position:absolute;right:0;top:calc(100% + 6px);z-index:40;display:grid;grid-template-columns:auto minmax(140px,1fr) auto;align-items:center;gap:8px;width:min(340px,calc(100vw - 20px));padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 22px #1018281a}
    .key-panel input{min-width:0;border:1px solid #cbd5e1;border-radius:8px;padding:8px 9px;font-size:16px}
    .key-panel input:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}
    .key-status{color:var(--muted);white-space:nowrap}
    .error{color:var(--red);background:#fff1f0;border:1px solid #fecaca;border-radius:10px;padding:9px 12px}
    .page-error{margin:8px 12px 0;flex:none}
    .chat-shell{flex:1;display:flex;flex-direction:column;min-height:0;width:100%;max-width:820px;margin:0 auto;background:var(--panel)}
    .messages{flex:1;overflow-y:auto;padding:16px 12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    .empty{padding:40px 16px;text-align:center;color:var(--muted)}
    .empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:5px}
    .message-row{display:flex;margin:0 0 14px}
    .message-row.user{justify-content:flex-end}
    .message-row > div{width:100%;min-width:0;display:flex;flex-direction:column}
    .message-row.user > div{align-items:flex-end}
    .message-row.assistant > div{align-items:flex-start}
    .bubble{width:fit-content;max-width:85%;padding:10px 13px;border-radius:14px;background:#fff;border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
    .message-row.user .bubble{background:var(--blue);border-color:var(--blue);color:#fff;border-bottom-right-radius:4px}
    .message-row.assistant .bubble{border-bottom-left-radius:4px}
    .message-meta{font-size:11px;color:var(--muted);margin:0 5px 4px}
    .message-row.user .message-meta{text-align:right}
    .sources{margin-top:8px;padding-top:7px;border-top:1px solid #edf0f3;font-size:11px;color:var(--muted)}
    .quick-replies{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
    .quick-replies button{font-size:13px;padding:8px 13px;min-height:40px;border-radius:999px}
    .thinking{display:flex;align-items:center;gap:8px;padding:2px 14px 12px;color:var(--muted);font-size:13px}
    .thinking-dots{display:inline-flex;gap:3px}
    .thinking-dots i{width:6px;height:6px;border-radius:50%;background:#94a3b8;animation:think 1.2s infinite}
    .thinking-dots i:nth-child(2){animation-delay:.18s}
    .thinking-dots i:nth-child(3){animation-delay:.36s}
    @keyframes think{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
    @media (prefers-reduced-motion: reduce){.thinking-dots i{animation:none;opacity:.7}}
    .chat-error{margin:0 12px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .chat-error button{flex:none}
    .composer{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--line);align-items:flex-end;flex:none}
    .composer textarea{flex:1;min-width:0;min-height:42px;max-height:140px;resize:none;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.4}
    .composer textarea:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}
    .composer .primary{min-width:72px;border-radius:12px}
    .composer-note{margin:0;padding:0 12px 8px;color:var(--muted);font-size:11px;text-align:center;background:#fff;flex:none}
    .drawer-backdrop{position:fixed;inset:0;background:#10182866;z-index:25}
    .thread-drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,88vw);background:#fff;z-index:30;box-shadow:8px 0 24px #1018281f;display:flex;flex-direction:column;transform:translateX(-105%);transition:transform .2s ease;visibility:hidden}
    .thread-drawer.open{transform:none;visibility:visible}
    .panel-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex:none}
    .panel-heading h2{font-size:15px;margin:0;flex:1}
    .panel-heading button{min-height:36px;padding:6px 10px;font-size:12px}
    .thread-list{padding:8px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
    .thread-item{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:10px;padding:10px;margin-bottom:4px;background:#fff;min-height:0}
    .thread-item.active{background:var(--blue-soft);border-color:#bfdbfe}
    .thread-item strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
    .thread-item small{display:block;color:var(--muted);margin-top:3px}
    .thread-item time{display:block;color:var(--muted);font-size:11px;margin-top:4px}
    @media (max-width:759px){
      .topbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center}
      .brand{grid-column:1;grid-row:1}
      .stats{grid-column:1 / -1;grid-row:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:100%;font-size:11px;text-align:center}
      .nav{grid-column:2;grid-row:1}
      .top-actions{grid-column:3;grid-row:1}
      .composer textarea{min-height:64px}
      .composer-note{padding-bottom:max(8px,env(safe-area-inset-bottom))}
    }
    @media (min-width:760px){
      .bubble{max-width:76%}
      .chat-shell{border-left:1px solid var(--line);border-right:1px solid var(--line)}
      button:hover{border-color:var(--blue);background:#f8fbff}
      .primary:hover{background:#1d4ed8;color:#fff}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/inbox">aihelper</a>
    <nav class="nav" aria-label="主导航"><a class="active" href="/inbox">Inbox</a><a href="/knowledge">Knowledge</a><a href="/documents">Documents</a></nav>
    <div class="stats" aria-label="知识概况">
      <span>知识库 <strong id="count-knowledge">—</strong></span>
      <span>本周 <strong id="count-week">—</strong></span>
      <span>待确认 <strong id="count-pending">—</strong></span>
      <span>未解缺口 <strong id="count-gaps">—</strong></span>
    </div>
    <div class="top-actions">
      <button id="history-toggle" type="button" aria-controls="thread-drawer" aria-expanded="false">历史</button>
      <details class="key-settings" id="key-settings">
        <summary>设置 <span id="key-status" class="key-status">未设置</span></summary>
        <form class="key-panel"><label for="api-key">API Key</label><input id="api-key" type="password" autocomplete="off" placeholder="输入后保存"><button id="save-key" type="button">保存</button></form>
      </details>
    </div>
  </header>
  <div id="page-error" class="error page-error" role="alert" hidden></div>
  <main class="chat-shell">
    <div id="messages" class="messages" aria-live="polite"><div class="empty"><strong>从一句话开始</strong>贴入产品知识、Telegram 对话，或告诉我你想补充什么。</div></div>
    <div id="thinking" class="thinking" aria-live="polite" hidden>
      <span class="thinking-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="thinking-text">正在理解你的内容……</span>
    </div>
    <div id="chat-error" class="error chat-error" role="alert" hidden>
      <span id="chat-error-text"></span>
      <button id="chat-error-retry" type="button">重试</button>
    </div>
    <form id="composer" class="composer">
      <textarea id="message-input" rows="1" placeholder="输入知识、粘贴对话，或告诉我想补充什么……" aria-label="消息"></textarea>
      <button id="send-button" class="primary" type="submit">发送</button>
    </form>
    <p id="composer-note" class="composer-note">Enter 发送 · Shift + Enter 换行</p>
  </main>
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="thread-drawer" class="thread-drawer" aria-label="最近对话">
    <div class="panel-heading">
      <h2>最近对话</h2>
      <button id="new-thread" type="button">＋ 新的对话</button>
      <button id="drawer-close" type="button">关闭</button>
    </div>
    <div id="thread-list" class="thread-list"></div>
  </aside>
  <script>
    const $ = id => document.getElementById(id);
    const CACHE_MODE = 'no-store';
    const SUBMIT_TIMEOUT_MS = 10000;
    const POLL_TIMEOUT_MS = 5000;
    const POLL_INTERVAL_MS = 2500;
    const POLL_RETRY_BASE_MS = 2000;
    const POLL_RETRY_MAX_MS = 10000;
    const MAX_POLL_FAILURES = 12;
    const THINKING_SLOW_MS = 10000;
    const WORKER_UNAVAILABLE_MESSAGE = '后台知识处理服务暂时不可用。内容已经保存，后台处理恢复后会继续。';
    const isCoarse = typeof window !== 'undefined' && typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches;
    const state = {threads: [], threadId: null, lastMessages: [], inboxRequest: 0, threadRequest: 0, sending: false, failedContent: '', requestKey: '', activeJob: null, failedJob: null, workerHealthy: null, workerUnavailable: false, pollTimer: 0, pollFailures: 0, thinkingStartedAt: 0, slowTimer: 0};
    const keyInput = $('api-key');
    if (keyInput) keyInput.value = getStoredKey();

    function getStoredKey() { try { return sessionStorage.getItem('x-api-key') || ''; } catch (_) { return ''; } }
    function setStoredKey(value) { try { sessionStorage.setItem('x-api-key', value); } catch (_) { /* storage unavailable */ } }
    function setKey(value) {
      const clean = String(value || '').trim();
      setStoredKey(clean);
      const status = $('key-status');
      if (status) status.textContent = clean ? '已保存' : '未设置';
    }
    setKey(getStoredKey());
    $('save-key').addEventListener('click', () => {
      setKey(keyInput ? keyInput.value : '');
      const settings = $('key-settings');
      if (settings) settings.open = false;
      loadInbox();
    });
    if (keyInput) keyInput.addEventListener('keydown', event => { if (event.key === 'Enter') $('save-key').click(); });

    function readStoredThreadId() { try { return localStorage.getItem('inbox-thread-id'); } catch (_) { return null; } }
    function writeStoredThreadId(id) {
      try {
        if (id == null) localStorage.removeItem('inbox-thread-id');
        else localStorage.setItem('inbox-thread-id', String(id));
      } catch (_) { /* storage unavailable */ }
    }

    function headers(json) {
      return {'x-api-key': getStoredKey(), ...(json ? {'Content-Type': 'application/json'} : {})};
    }

    async function api(path, options = {}, timeoutMs = POLL_TIMEOUT_MS) {
      if (!getStoredKey()) {
        const settings = $('key-settings');
        if (settings) settings.open = true;
        if (keyInput) keyInput.focus();
        throw new Error('请先在设置中保存 API Key');
      }
      const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = controller ? setTimeout(() => controller.abort(), timeoutMs) : 0;
      let response;
      try {
        response = await fetch(path, {
          cache: CACHE_MODE,
          ...options,
          signal: controller ? controller.signal : options.signal,
          headers: {...headers(Boolean(options.body)), ...(options.headers || {})},
        });
      } catch (error) {
        if (error && error.name === 'AbortError') throw new Error('连接暂时中断，正在重新连接……');
        throw new Error('无法连接服务，请确认 API 已启动');
      } finally {
        if (timer) clearTimeout(timer);
      }
      let data = {};
      try { data = await response.json(); } catch (_) { /* empty or non-JSON response */ }
      if (!response.ok) throw new Error((data && (data.detail || data.message)) || `请求失败（${response.status}）`);
      return data;
    }

    function listFrom(data) {
      if (Array.isArray(data)) return data;
      if (!data || typeof data !== 'object') return [];
      const result = data.items || data.threads || data.results || [];
      return Array.isArray(result) ? result : [];
    }

    function value(item, ...keys) {
      for (const key of keys) if (item && item[key] != null) return item[key];
      return '';
    }

    function displayDate(raw) {
      if (!raw) return '';
      const date = new Date(raw);
      return Number.isNaN(date.getTime()) ? String(raw) : date.toLocaleString('zh-CN', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'});
    }

    function countValue(data, ...keys) {
      const sources = [data && data.summary, data && data.counts, data];
      for (const source of sources) {
        for (const key of keys) if (source && source[key] != null) return source[key];
      }
      return '—';
    }

    function updateCounts(data) {
      const knowledge = $('count-knowledge');
      if (knowledge) knowledge.textContent = countValue(data, 'knowledge_count', 'knowledge');
      const week = countValue(data, 'week_new_count', 'week_new', 'new_this_week');
      const weekEl = $('count-week');
      if (weekEl) weekEl.textContent = typeof week === 'number' ? `+${week}` : week;
      const pending = $('count-pending');
      if (pending) pending.textContent = countValue(data, 'pending_count', 'pending');
      const gaps = $('count-gaps');
      if (gaps) gaps.textContent = countValue(data, 'unresolved_gap_count', 'unresolved_gaps', 'gaps', 'gap_count');
    }

    function updateWorkerState(data) {
      const worker = data && data.worker;
      if (!worker || typeof worker.healthy !== 'boolean') return;
      state.workerHealthy = worker.healthy;
      state.workerUnavailable = !worker.healthy;
      if (worker.healthy) clearError();
      else showError(WORKER_UNAVAILABLE_MESSAGE);
    }

    function reportWorkerUnavailable() {
      state.workerHealthy = false;
      state.workerUnavailable = true;
      state.activeJob = null;
      state.failedJob = null;
      hideThinking();
      setRetryLabel('重新连接');
      showError(WORKER_UNAVAILABLE_MESSAGE);
      showChatError(WORKER_UNAVAILABLE_MESSAGE);
      renderThreads();
      updateComposerDisabled();
    }

    function sourceLabels(sources) {
      if (sources == null || sources === '') return [];
      const list = Array.isArray(sources) ? sources : [sources];
      return list.map(source => typeof source === 'string' ? source : value(source, 'title', 'name', 'label', 'filename')).filter(Boolean).map(String);
    }

    function scrollToBottom() {
      const box = $('messages');
      if (box) box.scrollTop = box.scrollHeight;
    }

    function updateComposerDisabled() {
      const disabled = state.sending || state.activeJob != null;
      const sendButton = $('send-button');
      const input = $('message-input');
      if (sendButton) sendButton.disabled = disabled;
      if (input) input.disabled = disabled;
    }

    function renderThreads() {
      const box = $('thread-list');
      if (!box) return;
      box.replaceChildren();
      if (!state.threads.length) {
        box.innerHTML = '<div class="empty">还没有对话。<br>发送第一条消息即可开始。</div>';
        return;
      }
      for (const thread of state.threads) {
        const id = value(thread, 'id', 'thread_id');
        const button = document.createElement('button');
        button.className = 'thread-item' + (String(id) === String(state.threadId) ? ' active' : '');
        button.type = 'button';
        button.disabled = state.sending || state.activeJob != null;
        button.innerHTML = '<strong></strong><small></small><time></time>';
        button.querySelector('strong').textContent = value(thread, 'title', 'subject', 'preview') || '未命名对话';
        const count = value(thread, 'message_count');
        button.querySelector('small').textContent = count !== '' ? `${count} 条消息` : '';
        button.querySelector('time').textContent = displayDate(value(thread, 'updated_at', 'created_at'));
        button.onclick = () => { closeDrawer(); openThread(id); };
        box.append(button);
      }
    }

    function quickReplyLabels(messageType) {
      if (messageType === 'batch_confirmation') return ['全部确认明确知识', '查看明细', '我来修正'];
      if (messageType === 'clarification') return ['我来回答', '不知道', '跳过'];
      return ['对', '不对，我来修正', '不知道', '跳过'];
    }

    function renderQuickReplies(container, messageType) {
      const replies = document.createElement('div');
      replies.className = 'quick-replies';
      replies.setAttribute('aria-label', '快速回复');
      for (const label of quickReplyLabels(messageType)) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = label;
        button.onclick = () => {
          if (state.sending) return;
          const action = (label === '我来修正' || label === '不对，我来修正') ? 'correct' : label;
          if (action === 'correct' || action === '我来回答') {
            const input = $('message-input');
            if (input) input.focus();
            return;
          }
          sendMessage(label);
        };
        replies.append(button);
      }
      container.append(replies);
    }

    function renderMessages(data) {
      const messages = data && Array.isArray(data.messages) ? data.messages : listFrom(data);
      state.lastMessages = messages;
      const box = $('messages');
      if (!box) return;
      box.replaceChildren();
      if (!messages.length) {
        box.innerHTML = '<div class="empty"><strong>从一句话开始</strong>这里会保留完整对话。</div>';
        return;
      }
      const lastIndex = messages.length - 1;
      for (const [index, item] of messages.entries()) {
        const role = String(value(item, 'role', 'sender_type', 'author') || 'assistant').toLowerCase();
        const user = ['user', 'human', 'me', 'customer'].includes(role);
        const row = document.createElement('div');
        row.className = 'message-row ' + (user ? 'user' : 'assistant');
        const wrap = document.createElement('div');
        const meta = document.createElement('div');
        meta.className = 'message-meta';
        meta.textContent = user ? '我' : 'aihelper';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = String(value(item, 'content', 'text', 'message', 'body'));
        const labels = sourceLabels(value(item, 'sources', 'source'));
        if (labels.length) {
          const sourceBox = document.createElement('div');
          sourceBox.className = 'sources';
          sourceBox.textContent = '来源：' + labels.join('、');
          bubble.append(sourceBox);
        }
        wrap.append(meta, bubble);
        const messageType = String(value(item, 'message_type', 'type')).toLowerCase();
        if (index === lastIndex && !user && ['question', 'confirmation', 'clarification', 'batch_confirmation'].includes(messageType) && !state.sending && !state.activeJob) {
          renderQuickReplies(wrap, messageType);
        }
        row.append(wrap);
        box.append(row);
      }
      scrollToBottom();
    }

    async function openThread(id) {
      if (!id || state.sending) return;
      state.threadId = id;
      writeStoredThreadId(id);
      const request = ++state.threadRequest;
      renderThreads();
      try {
        const data = await api(`/api/v2/inbox/threads/${encodeURIComponent(id)}`, {}, POLL_TIMEOUT_MS);
        if (request !== state.threadRequest || String(state.threadId) !== String(id)) return;
        renderMessages(data);
        resumeActiveJob(data.jobs);
      } catch (error) {
        if (request !== state.threadRequest) return;
        showError(error.message);
      }
    }

    async function loadInbox() {
      const request = ++state.inboxRequest;
      clearError();
      try {
        const data = await api('/api/v2/inbox');
        if (request !== state.inboxRequest) return;
        updateCounts(data);
        updateWorkerState(data);
        state.threads = listFrom(data);
        renderThreads();
        const idOf = thread => String(value(thread, 'id', 'thread_id'));
        let target = state.threadId;
        if (!state.threads.some(thread => idOf(thread) === String(target))) {
          const remembered = readStoredThreadId();
          target = state.threads.some(thread => idOf(thread) === String(remembered))
            ? remembered
            : (state.threads[0] ? idOf(state.threads[0]) : null);
        }
        if (target) await openThread(target);
        else { state.threadId = null; renderMessages([]); }
      } catch (error) {
        if (request !== state.inboxRequest) return;
        showError(error.message);
        state.threads = [];
        renderThreads();
      }
    }

    async function refreshThreads() {
      try {
        const data = await api('/api/v2/inbox');
        updateCounts(data);
        state.threads = listFrom(data);
        renderThreads();
      } catch (_) { /* side-panel refresh is best-effort */ }
    }

    function showThinking(status = 'processing') {
      const box = $('thinking');
      const text = $('thinking-text');
      if (!state.thinkingStartedAt) state.thinkingStartedAt = Date.now();
      if (text) text.textContent = '正在理解你的内容……';
      if (box) box.hidden = false;
      updateComposerDisabled();
      clearTimeout(state.slowTimer);
      const elapsed = Date.now() - state.thinkingStartedAt;
      const showSlowState = () => {
        const slow = $('thinking-text');
        if (state.activeJob && ['queued', 'processing'].includes(state.activeJob.status) && slow) {
          slow.textContent = '正在查看已有知识，还需要一点时间……';
        }
      };
      if (elapsed >= THINKING_SLOW_MS) showSlowState();
      else state.slowTimer = setTimeout(showSlowState, THINKING_SLOW_MS - elapsed);
    }

    function hideThinking() {
      clearTimeout(state.slowTimer);
      state.slowTimer = 0;
      state.thinkingStartedAt = 0;
      const box = $('thinking');
      if (box) box.hidden = true;
      updateComposerDisabled();
    }

    function showChatError(message) {
      const box = $('chat-error');
      const text = $('chat-error-text');
      if (text) text.textContent = message || '发送失败，请重试。';
      if (box) box.hidden = false;
    }

    function clearChatError() {
      const box = $('chat-error');
      if (box) box.hidden = true;
    }

    function setRetryLabel(label) {
      const button = $('chat-error-retry');
      if (button) button.textContent = label;
    }

    function newRequestKey() {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
      return `inbox-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function clearPollTimer() {
      if (state.pollTimer) clearTimeout(state.pollTimer);
      state.pollTimer = 0;
    }

    function normalizeJob(job) {
      if (!job || typeof job !== 'object') return null;
      const jobId = job.job_id != null ? job.job_id : job.id;
      if (jobId == null || String(jobId).trim() === '') return null;
      return {...job, job_id: jobId};
    }

    function scheduleJobPoll(delay = POLL_INTERVAL_MS) {
      clearPollTimer();
      if (!normalizeJob(state.activeJob)) return;
      state.pollTimer = setTimeout(() => pollJob(state.activeJob), delay);
    }

    function scheduleReconnect() {
      const exponent = Math.min(6, Math.max(0, state.pollFailures - 1));
      const delay = Math.min(POLL_RETRY_MAX_MS, POLL_RETRY_BASE_MS * (2 ** exponent));
      scheduleJobPoll(delay);
    }

    async function pollJob(job) {
      const normalized = normalizeJob(job);
      const active = normalizeJob(state.activeJob);
      if (!normalized || !active || String(normalized.job_id) !== String(active.job_id)) return;
      job = normalized;
      state.activeJob = active;
      showThinking(job.status);
      try {
        const data = await api(`/api/v2/inbox/jobs/${encodeURIComponent(job.job_id)}`, {}, POLL_TIMEOUT_MS);
        if (!state.activeJob || String(data.job_id) !== String(state.activeJob.job_id)) return;
        state.activeJob = data;
        state.pollFailures = 0;
        if (data.status === 'queued' || data.status === 'processing') {
          if (data.worker_healthy === false) {
            reportWorkerUnavailable();
            return;
          }
          clearChatError();
          showThinking(data.status);
          updateComposerDisabled();
          scheduleJobPoll();
          return;
        }
        if (data.status === 'failed') {
          state.activeJob = null;
          state.failedJob = data;
          hideThinking();
          setRetryLabel('重新处理');
          showChatError(data.error_message || '处理失败');
          renderThreads();
          updateComposerDisabled();
          return;
        }
        if (data.status === 'completed') {
          try {
            const refreshed = await api(`/api/v2/inbox/threads/${encodeURIComponent(data.thread_id)}`, {}, POLL_TIMEOUT_MS);
            if (!state.activeJob || String(data.job_id) !== String(state.activeJob.job_id)) return;
            state.activeJob = null;
            state.failedJob = null;
            hideThinking();
            clearChatError();
            renderMessages(refreshed);
            refreshThreads();
            renderThreads();
          } catch (_) {
            state.pollFailures = Math.min(MAX_POLL_FAILURES, state.pollFailures + 1);
            setRetryLabel('重新连接');
            showChatError('连接暂时中断，正在重新连接……');
            scheduleReconnect();
          }
        }
      } catch (_) {
        state.pollFailures = Math.min(MAX_POLL_FAILURES, state.pollFailures + 1);
        setRetryLabel('重新连接');
        showChatError(state.pollFailures < MAX_POLL_FAILURES
          ? '连接暂时中断，正在重新连接……'
          : '连接暂时中断，后台任务仍在继续，正在自动重试……');
        scheduleReconnect();
      }
    }

    function resumeActiveJob(jobs) {
      const active = Array.isArray(jobs) ? jobs.find(job => ['queued', 'processing'].includes(job.status)) : null;
      if (!active) return;
      if (state.workerHealthy === false) {
        reportWorkerUnavailable();
        return;
      }
      const normalized = normalizeJob(active);
      if (!normalized) {
        showChatError('任务状态缺少编号，请刷新后重试。');
        return;
      }
      state.activeJob = normalized;
      state.pollFailures = 0;
      clearChatError();
      showThinking(active.status);
      scheduleJobPoll();
      renderThreads();
      updateComposerDisabled();
    }

    async function retryJob(job) {
      const normalized = normalizeJob(job);
      if (!normalized || state.sending) return;
      clearChatError();
      state.failedJob = null;
      state.activeJob = {...normalized, status: 'queued'};
      state.pollFailures = 0;
      showThinking('queued');
      renderThreads();
      updateComposerDisabled();
      try {
        const data = await api(`/api/v2/inbox/jobs/${encodeURIComponent(normalized.job_id)}/retry`, {method: 'POST'}, POLL_TIMEOUT_MS);
        const retryJobData = normalizeJob(data);
        if (!retryJobData) throw new Error('服务未返回有效任务编号，请重试。');
        state.activeJob = retryJobData;
        updateComposerDisabled();
        pollJob(state.activeJob);
      } catch (error) {
        state.activeJob = null;
        state.failedJob = job;
        hideThinking();
        showChatError(error.message || '处理失败');
        setRetryLabel('重新处理');
        renderThreads();
      }
    }

    async function sendMessage(content, requestKey = null) {
      if (state.sending || state.activeJob) return;
      const sendButton = $('send-button');
      const input = $('message-input');
      state.sending = true;
      state.failedJob = null;
      state.failedContent = '';
      // A key is reused only when recovering a submit whose response was
      // lost. Every new user message gets a fresh idempotency key.
      state.requestKey = requestKey || newRequestKey();
      clearChatError();
      const previous = state.lastMessages[state.lastMessages.length - 1];
      const optimistic = previous && previous.role === 'user' && previous.content === content
        ? state.lastMessages.slice()
        : state.lastMessages.concat([{role: 'user', content}]);
      renderMessages({messages: optimistic});
      showThinking('queued');
      if (sendButton) sendButton.disabled = true;
      let data = null;
      try {
        const body = {content};
        if (state.threadId) body.thread_id = state.threadId;
        data = await api('/api/v2/inbox/messages', {method: 'POST', body: JSON.stringify(body), headers: {'Idempotency-Key': state.requestKey}}, SUBMIT_TIMEOUT_MS);
      } catch (error) {
        state.failedContent = content;
        hideThinking();
        setRetryLabel('重试');
        showChatError('连接暂时中断，正在重新连接……');
        return;
      } finally {
        state.sending = false;
        updateComposerDisabled();
      }
      const activeJob = normalizeJob(data);
      if (!activeJob) {
        state.failedContent = content;
        hideThinking();
        setRetryLabel('重试');
        showChatError('服务未返回有效任务编号，请重试。');
        return;
      }
      if (data && data.thread_id) {
        state.threadId = data.thread_id;
        writeStoredThreadId(data.thread_id);
      }
      state.activeJob = activeJob;
      state.pollFailures = 0;
      showThinking(data.status || 'queued');
      renderThreads();
      updateComposerDisabled();
      pollJob(state.activeJob);
      if (input && !isCoarse) input.focus();
    }

    function startNewThread() {
      clearPollTimer();
      state.activeJob = null;
      state.failedJob = null;
      state.failedContent = '';
      updateComposerDisabled();
      state.threadId = null;
      writeStoredThreadId(null);
      renderMessages([]);
      closeDrawer();
      const input = $('message-input');
      if (input && !isCoarse) input.focus();
    }

    function openDrawer() {
      const drawer = $('thread-drawer');
      if (drawer) drawer.classList.add('open');
      const backdrop = $('drawer-backdrop');
      if (backdrop) backdrop.hidden = false;
      const toggle = $('history-toggle');
      if (toggle) toggle.setAttribute('aria-expanded', 'true');
    }

    function closeDrawer() {
      const drawer = $('thread-drawer');
      if (drawer) drawer.classList.remove('open');
      const backdrop = $('drawer-backdrop');
      if (backdrop) backdrop.hidden = true;
      const toggle = $('history-toggle');
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
    }

    function autoGrow(input) {
      if (!input || !input.style) return;
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight || 42, 140) + 'px';
    }

    $('composer').addEventListener('submit', event => {
      event.preventDefault();
      if (state.sending || state.activeJob) return;
      const input = $('message-input');
      const content = String((input && input.value) || '').trim();
      if (!content) return;
      input.value = '';
      autoGrow(input);
      sendMessage(content);
    });
    $('message-input').addEventListener('input', event => autoGrow(event.target));
    if (isCoarse) {
      const note = $('composer-note');
      if (note) note.hidden = true;
    }
    $('message-input').addEventListener('keydown', event => {
      if (isCoarse) return;
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        const form = $('composer');
        if (form) form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', {cancelable: true}));
      }
    });
    $('history-toggle').addEventListener('click', openDrawer);
    $('drawer-close').addEventListener('click', closeDrawer);
    $('drawer-backdrop').addEventListener('click', closeDrawer);
    $('new-thread').addEventListener('click', startNewThread);
    $('chat-error-retry').addEventListener('click', () => {
      if (state.workerUnavailable) {
        state.workerUnavailable = false;
        loadInbox();
        return;
      }
      if (state.failedJob) return retryJob(state.failedJob);
      if (state.activeJob) {
        state.pollFailures = 0;
        clearChatError();
        pollJob(state.activeJob);
        return;
      }
      const content = state.failedContent;
      if (content) sendMessage(content, state.requestKey);
    });

    function showError(message) { const box = $('page-error'); if (!box) return; box.textContent = message; box.hidden = false; }
    function clearError() { const box = $('page-error'); if (box) box.hidden = true; }

    loadInbox();
  </script>
</body>
</html>
