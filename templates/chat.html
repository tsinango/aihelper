<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat · aihelper V2</title>
  <style>
    :root{--bg:#f6f7f9;--panel:#fff;--line:#e5e7eb;--text:#17212b;--muted:#667085;--blue:#2563eb;--blue-soft:#eff6ff;--red:#b42318;--shadow:0 1px 2px #1018280d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--text);padding:8px 12px;cursor:pointer}button:hover{border-color:var(--blue);background:#f8fbff}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.primary:hover{background:#1d4ed8;color:#fff}button:disabled{opacity:.55;cursor:wait}.topbar{min-height:60px;border-bottom:1px solid var(--line);background:#fff}.shell{max-width:900px;margin:0 auto;padding:0 20px}.top-inner{display:flex;align-items:center;gap:18px;min-height:60px}.brand{font-weight:750;color:var(--text);text-decoration:none}.nav{display:flex;gap:4px}.nav a{color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:7px}.nav a:hover,.nav a.active{background:var(--blue-soft);color:var(--blue)}.keybox{display:flex;align-items:center;gap:7px;margin-left:auto;color:var(--muted);font-size:12px}.keybox input{width:170px;border:1px solid #cbd5e1;border-radius:7px;padding:7px 8px}.page{padding:30px 0}.chat-card{height:calc(100vh - 120px);min-height:560px;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}.chat-head{padding:17px 20px;border-bottom:1px solid var(--line)}.chat-head h1{font-size:19px;margin:0 0 3px}.chat-head p{margin:0;color:var(--muted);font-size:13px}.messages{flex:1;overflow:auto;padding:25px 22px;background:#fbfcfe}.empty{text-align:center;color:var(--muted);padding:70px 20px}.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:5px}.message-row{display:flex;margin-bottom:15px}.message-row.user{justify-content:flex-end}.wrap{max-width:min(78%,680px)}.meta{color:var(--muted);font-size:11px;margin:0 5px 4px}.message-row.user .meta{text-align:right}.bubble{padding:11px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;white-space:pre-wrap;overflow-wrap:anywhere;border-bottom-left-radius:4px}.message-row.user .bubble{background:var(--blue);border-color:var(--blue);color:#fff;border-bottom-left-radius:13px;border-bottom-right-radius:4px}.sources{margin-top:8px;padding-top:7px;border-top:1px solid #edf0f3;color:var(--muted);font-size:11px}.composer{display:flex;gap:8px;align-items:flex-end;padding:14px 16px;border-top:1px solid var(--line)}textarea{flex:1;min-height:44px;max-height:150px;resize:vertical;border:1px solid #cbd5e1;border-radius:9px;padding:10px 11px}textarea:focus,.keybox input:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}.note{padding:0 16px 11px;color:var(--muted);font-size:11px}.error{color:var(--red);background:#fff1f0;border:1px solid #fecaca;border-radius:8px;padding:9px 11px;margin-bottom:12px}@media(max-width:720px){.shell{padding:0 10px}.top-inner{flex-wrap:wrap;height:auto;padding:10px 0;gap:8px}.keybox{width:100%;margin-left:0}.keybox input{flex:1}.chat-card{height:calc(100vh - 105px);min-height:500px}.wrap{max-width:90%}}
  </style>
</head>
<body>
  <header class="topbar"><div class="shell top-inner"><a class="brand" href="/inbox">aihelper V2</a><nav class="nav" aria-label="主导航"><a href="/inbox">Inbox</a><a href="/knowledge">Knowledge</a><a href="/documents">Documents</a><a class="active" href="/chat">Chat</a></nav><label class="keybox">API Key <input id="api-key" type="password" autocomplete="off" placeholder="sessionStorage"><span id="key-status">未设置</span></label></div></header>
  <main class="shell page"><div id="error" class="error" hidden></div><section class="chat-card"><header class="chat-head"><h1>Chat</h1><p>只根据已经确认的产品知识回答。没有足够依据时，我会明确告诉你。</p></header><div id="messages" class="messages"><div class="empty"><strong>你好</strong>问一个产品问题，或粘贴一段资料开始对话。</div></div><form id="composer" class="composer"><textarea id="input" placeholder="输入产品问题…" aria-label="产品问题"></textarea><button class="primary" type="submit">发送</button></form><div class="note">Enter 发送 · Shift + Enter 换行</div></section></main>
  <script>
    const $=id=>document.getElementById(id),key=$('api-key'),state={threadId:new URLSearchParams(location.search).get('thread')};key.value=sessionStorage.getItem('x-api-key')||'';function saveKey(){sessionStorage.setItem('x-api-key',key.value.trim());$('key-status').textContent=key.value.trim()?'已保存':'未设置'}saveKey();key.addEventListener('change',saveKey);const headers=json=>({'x-api-key':sessionStorage.getItem('x-api-key')||'',...(json?{'Content-Type':'application/json'}:{})});async function api(path,options={}){const r=await fetch(path,{...options,headers:{...headers(Boolean(options.body)),...(options.headers||{})}});let d={};try{d=await r.json()}catch(_){ }if(!r.ok)throw Error(d.detail||d.message||`请求失败（${r.status}）`);return d}function list(data){return Array.isArray(data)?data:(data.messages||data.items||[])}function value(item,...keys){for(const key of keys)if(item&&item[key]!=null)return item[key];return ''}function render(data){const messages=list(data.thread||data),box=$('messages');box.replaceChildren();if(!messages.length){box.innerHTML='<div class="empty"><strong>你好</strong>问一个产品问题，或粘贴一段资料开始对话。</div>';return}for(const item of messages){const role=String(value(item,'role','sender_type','author')||'assistant').toLowerCase(),user=['user','human','me','customer'].includes(role),row=document.createElement('div');row.className='message-row '+(user?'user':'assistant');const wrap=document.createElement('div');wrap.className='wrap';const meta=document.createElement('div');meta.className='meta';meta.textContent=user?'我':'aihelper';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=value(item,'content','text','message','body');const sources=value(item,'sources','source');if(sources&&(Array.isArray(sources)?sources.length:true)){const sourceBox=document.createElement('div');sourceBox.className='sources';sourceBox.textContent='来源：'+(Array.isArray(sources)?sources.map(x=>typeof x==='string'?x:value(x,'title','name','label')).join('、'):sources);bubble.append(sourceBox)}wrap.append(meta,bubble);row.append(wrap);box.append(row)}box.scrollTop=box.scrollHeight}async function loadThread(){if(!state.threadId)return;try{render(await api(`/api/v2/inbox/threads/${encodeURIComponent(state.threadId)}`))}catch(e){showError(e.message)}}async function send(content){const button=$('#composer button');button.disabled=true;try{const body={content};if(state.threadId)body.thread_id=state.threadId;const data=await api('/api/v2/inbox/messages',{method:'POST',body:JSON.stringify(body)});state.threadId=data.thread_id||state.threadId;if(data.thread||data.messages)render(data.thread||data);else render({messages:[{role:'user',content}]});if(state.threadId)history.replaceState(null,'',`/chat?thread=${encodeURIComponent(state.threadId)}`)}catch(e){showError(e.message)}finally{button.disabled=false}}function showError(msg){$('error').textContent=msg;$('error').hidden=false}$('composer').addEventListener('submit',e=>{e.preventDefault();const input=$('input'),content=input.value.trim();if(!content)return;input.value='';send(content)});$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}});loadThread();
  </script>
</body>
</html>
