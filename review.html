t-weight:650}.group-thread-head small{display:block;color:var(--muted);margin-top:2px}.group-thread-body{border-top:1px solid #edf0f3;padding:7px 9px}.group-thread-body .message{margin:0 -9px;padding:7px 9px}.group-thread-body .message:first-child{border-top:0}.group-member-tag{font-size:10px;padding:2px 5px;border-radius:4px;background:#ecfdf3;color:var(--green);white-space:nowrap}.group-member-tag.excluded{background:#f2f4f7;color:var(--muted)}.group-fact{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:7px;background:#fcfcfd}.group-fact.conflict{border-color:#f04438;background:var(--red-bg)}.group-fact-head{display:flex;gap:7px;align-items:flex-start}.group-fact-head label{display:flex;gap:5px;flex:1}.group-fact-text{white-space:pre-wrap;overflow-wrap:anywhere}.group-fact-meta{color:var(--muted);font-size:11px;margin-top:4px}.group-source{display:inline-block;margin:3px 3px 0 0;padding:2px 5px;border-radius:4px;background:#eef4ff;color:#175cd3;font-size:10px}.group-conflict{color:var(--red);font-weight:650;font-size:11px;margin-top:5px}.group-draft textarea{min-height:82px}.group-draft .field{margin-bottom:9px}.group-draft .save-row{margin-top:6px}.group-warning{padding:8px;border-radius:6px;background:var(--amber-bg);color:var(--amber);font-size:11px;margin-bottom:9px}.group-error{padding:8px;border-radius:6px;background:var(--red-bg);color:var(--red);font-size:11px;margin-bottom:9px}.group-detail-scroll{max-height:calc(100vh - 155px)}

    .thread-tools{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:7px}.thread-tools select{width:auto}.relation-summary{padding:5px 7px;border-radius:5px;background:#f8fafc;color:var(--muted);font-size:11px}.message[data-message-id]{cursor:default}.match-card{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:7px;background:#fcfcfd}.match-answer{white-space:pre-wrap;max-height:120px;overflow:auto;margin-top:4px}.match-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.match-actions button{font-size:11px;padding:4px 6px}

<body>
  <header class="topbar"><h1>历史问答整理审核台</h1><a href="/review/published">已发布知识</a><label>API Key <input id="api-key" type="password" autocomplete="current-password"></label><label>审核人 <input id="reviewer" value="internal-reviewer" autocomplete="off"></label><span id="status" class="status">请输入 API Key</span></header>
  <nav class="toolbar"><div class="mode-switch"><button id="candidate-mode" class="active" type="button">单候选审核</button><button id="group-mode" type="button">相似问题组</button></div><select id="status-filter"><option value="">全部审核状态</option><option value="pending">待审核</option><option value="corrected">已修订</option><option value="approved">已批准</option><option value="needs_engineer">需工程师</option><option value="rejected">已拒绝</option><option value="duplicate">重复</option></select><select id="answer-status-filter"><option value="">全部答案状态</option><option value="pending">答案待确认</option><option value="approved">答案已确认</option><option value="needs_context">缺少上下文</option><option value="rejected">答案不可用</option><option value="duplicate">答案重复</option></select><select id="scope-level-filter"><option value="">全部泛化层级</option><option value="generic">通用</option><option value="brand">品牌</option><option value="family">产品家族</option><option value="series">产品系列</option><option value="model">具体型号</option><option value="conditional">条件化</option><option value="unspecified">未指定</option></select><input id="search" class="search" placeholder="搜索问题、知识主题、候选编号"><input id="model-filter" class="small" placeholder="型号筛选"><input id="domain-filter" class="small" placeholder="领域筛选"><button id="refresh">刷新队列</button><button id="approved-drafts" class="approve">已发布知识 <span id="approved-drafts-count">0</span></button><div id="counts" class="counts"></div><div id="group-controls" class="group-controls" hidden><select id="group-status-filter"><option value="">全部分组状态</option><option value="open">待审核</option><option value="published">已发布</option><option value="cancelled">已取消</option></select><select id="grouping-mode"><option value="deterministic">确定性分组（默认）</option><option value="v1_1">V1.1 / knowledge_key 分组</option><option value="semantic">OpenRouter 语义建议</option></select><input id="group-search" placeholder="搜索主题、问题、分组编号"><button id="group-refresh" type="button">刷新分组</button><button id="group-build" class="primary" type="button">发现相似问题组</button></div></nav>
  <main id="candidate-layout" class="layout">
    <section class="panel queue-panel"><div class="panel-head"><h2>600 条历史整理队列</h2><span id="queue-total" class="hint"></span></div><div class="panel-body scroll"><div id="queue-progress" class="queue-progress">请输入 API Key 后加载候选。</div><div id="queue" class="queue-list"><div class="empty">暂无候选</div></div><div class="queue-footer"><button id="previous-page">上一页</button><span id="page-label" class="hint"></span><button id="next-page">下一页</button></div></div></section>
    <section class="panel editor-panel"><div class="panel-head"><div class="review-title"><h2 id="candidate-heading">整理结果</h2><span id="review-status" class="status-pill"></span><span id="answer-status" class="status-pill"></span></div><div class="nav"><button id="previous">← 上一条</button><button id="next">下一条 →</button></div></div><div id="candidate-editor" class="panel-body scroll"><div class="empty">从左侧选择一条历史问答。</div></div></section>
    <aside class="panel context-panel"><div class="panel-head"><h2>原始依据与审核操作</h2><span id="context-summary" class="hint"></span></div><div class="panel-body scroll"><section class="section"><h3 class="section-title">原问题 / 完整 Telegram 线程</h3><div id="thread"><div class="empty">选择候选后显示完整线程。</div></div></section><section class="section"><h3 class="section-title">官方文档证据</h3><div id="evidence"><div class="empty">暂无关联文档证据。</div></div></section><section class="section"><h3 class="section-title">已有知识匹配</h3><div id="matches"><div class="empty">选择候选后自动查找已发布知识。</div></div></section><section class="section"><h3 class="section-title">审核决定</h3><div class="action-grid"><button id="approve" class="approve">批准，进入知识储备</button><button id="save" class="primary">保存整理结果</button><div class="row"><button id="needs-engineer" class="warn">需工程师确认</button><button id="reject" class="danger">拒绝</button></div><button id="duplicate" class="warn">标为重复</button></div><div class="field" style="margin-top:9px"><label for="review-note">审核备注</label><textarea id="review-note" class="review-note" placeholder="记录泛化边界、缺少的型号/条件或修改理由"></textarea></div><div class="field"><label for="reject-reason">拒绝原因</label><select id="reject-reason"><option value="">拒绝时选择</option><option value="bad_candidate">候选答案不合格</option><option value="wrong_topic">主题错误</option><option value="duplicate">重复</option><option value="not_useful">不可复用</option><option value="insufficient_context">上下文不足</option><option value="other">其他</option></select></div><div class="field"><label for="duplicate-of">重复候选编号</label><input id="duplicate-of" placeholder="例如 CAND-001"></div></section><section class="section"><h3 class="section-title">辅助操作</h3><div class="action-grid"><button id="split">拆分选中的线程</button><button id="negative">标记为不同主题</button></div><div class="field" style="margin-top:8px"><input id="alias-concept" placeholder="概念，例如 hik_connect_server"><input id="alias-value" style="margin-top:5px" placeholder="别名，例如 Hik Connect 地址"><button id="add-alias" style="margin-top:5px">保存术语别名</button><div id="alias-message" class="hint"></div></div></section><section class="section"><h3 class="section-title">审核记录</h3><div id="audit" class="audit muted">暂无候选。</div></section></div></aside>
  </main>
  <main id="group-workspace" class="group-workspace" hidden>
    <section class="panel group-panel group-list-panel"><div class="panel-head"><h2>相似问题组</h2><span id="group-total" class="hint"></span></div><div class="panel-body scroll"><div id="group-progress" class="queue-progress">请输入 API Key 后加载分组。</div><div id="group-list" class="group-list"><div class="empty">暂无相似问题组</div></div><div class="group-list-footer"><button id="group-previous">上一页</button><span id="group-page-label" class="hint"></span><button id="group-next">下一页</button></div></div></section>
    <section class="panel group-panel group-editor-panel"><div class="panel-head"><div class="group-heading"><h2 id="group-heading">选择相似问题组</h2><span id="group-status" class="status-pill"></span></div><div class="group-actions"><button id="group-save" class="primary" type="button">保存分组</button><button id="group-recompute" type="button">重新发现</button><button id="group-approve" class="approve" type="button">批准并立即发布</button></div></div><div id="group-editor" class="panel-body group-detail-scroll"><div class="empty">从左侧选择一个分组。</div></div></section>
    <aside class="panel group-panel group-side-panel"><div class="panel-head"><h2>汇总草稿与审核</h2><span id="group-context-summary" class="hint"></span></div><div id="group-side" class="panel-body group-detail-scroll"><div class="empty">选择分组后编辑汇总答案。</div></div></aside>
  </main>
  <script>
    const ROLE_VALUES=['user_report','engineer_hypothesis','engineer_instruction','observed_result','confirmed_resolution','unconfirmed_claim','irrelevant'];
    const ROLE_LABELS={user_report:'用户描述',engineer_hypothesis:'工程师推测',engineer_instruction:'工程师指导',observed_result:'观察结果',confirmed_resolution:'确认解决',unconfirmed_claim:'未确认说法',irrelevant:'无关'};
    const EVIDENCE_VALUES=['supports','partial','irrelevant','conflict','unreviewed'];
    const state={items:[],page:1,pages:1,limit:100,total:0,index:-1,detail:null,mode:'candidate',groups:[],groupPage:1,groupPages:1,groupLimit:50,groupTotal:0,groupDetail:null};
    const $=id=>document.getElementById(id), key=$('api-key');key.value=sessionStorage.getItem('review-api-key')||'';$('reviewer').value=sessionStorage.getItem('reviewer-name')||'internal-reviewer';
    function setStatus(text,bad=false){$('status').textContent=text;$('status').style.color=bad?'#fda29b':'#d0d5dd'}
    function headers(json=false){const h={'x-api-key':key.value};if(json)h['content-type']='application/json';return h}

    function setReviewMode(mode){state.mode=mode;const groups=mode==='group';$('candidate-layout').hidden=groups;$('group-workspace').hidden=!groups;$('group-controls').hidden=!groups;$('candidate-mode').classList.toggle('active',!groups);$('group-mode').classList.toggle('active',groups);if(groups)loadGroups(1);else{renderQueue();if(state.detail){renderEditor(state.detail);renderThread(state.detail.cases||[]);renderEvidence(state.detail.evidence||[])}}}

    function selectedCases(){return [...document.querySelectorAll('.case-check:checked')].map(x=>Number(x.dataset.caseId))}async function splitCandidate(){if(!state.detail)return;const ids=selectedCases();if(!ids.length)return setStatus('请先选择要拆分的线程',true);try{const d=await api(`/api/review/candidates/${encodeURIComponent(state.detail.candidate.candidate_id)}/split`,{method:'POST',body:JSON.stringify({support_case_ids:ids,reviewer:$('reviewer').value.trim()})});setStatus(`已创建 ${d.candidate_id}`);await loadQueue(state.page);await loadCandidate(d.candidate_id)}catch(e){setStatus(e.message,true)}}
    async function negativePair(){if(!state.detail)return;const ids=selectedCases();if(ids.length<2)return setStatus('请至少选择两个线程',true);try{await api(`/api/review/candidates/${encodeURIComponent(state.detail.candidate.candidate_id)}/negative-pair`,{method:'POST',body:JSON.stringify({support_case_ids:ids,reviewer:$('reviewer').value.trim()})});setStatus('已保存为不同主题样本')}catch(e){setStatus(e.message,true)}}async function addAlias(){try{const d=await api('/api/review/aliases',{method:'POST',body:JSON.stringify({concept:$('alias-concept').value,alias:$('alias-value').value,reviewer:$('reviewer').value.trim()})});$('alias-message').textContent=`已保存：${d.concept} ← ${d.alias}`;$('alias-value').value=''}catch(e){$('alias-message').textContent=e.message}}
    async function refreshDraftCount(){try{$('approved-drafts-count').textContent=(await api('/api/review/publication-queue')).total||0}catch(_){} }function move(delta){if(!state.items.length)return;const n=Math.max(0,Math.min(state.items.length-1,state.index+delta));state.index=n;loadCandidate(state.items[n].candidate_id)}
    $('refresh').onclick=()=>{loadQueue(1);refreshDraftCount()};$('status-filter').onchange=()=>loadQueue(1);['search','model-filter','domain-filter'].forEach(id=>$(id).onkeydown=e=>{if(e.key==='Enter')loadQueue(1)});$('previous-page').onclick=()=>{if(state.page>1)loadQueue(state.page-1)};$('next-page').onclick=()=>{if(state.page<state.pages)loadQueue(state.page+1)};key.onchange=()=>{loadQueue(1);refreshDraftCount()};$('reviewer').onchange=remember;$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('approve').onclick=()=>saveReview('approve');$('save').onclick=()=>saveReview('save_correction');$('needs-engineer').onclick=()=>saveReview('needs_engineer');$('reject').onclick=()=>saveReview('reject');$('duplicate').onclick=()=>saveReview('duplicate');$('split').onclick=splitCandidate;$('negative').onclick=negativePair;$('add-alias').onclick=addAlias;$('approved-drafts').onclick=()=>window.location='/review/published';$('candidate-mode').onclick=()=>setReviewMode('candidate');$('group-mode').onclick=()=>setReviewMode('group');$('group-refresh').onclick=()=>loadGroups(1);$('group-build').onclick=buildGroups;$('group-status-filter').onchange=()=>loadGroups(1);$('group-search').onkeydown=e=>{if(e.key==='Enter')loadGroups(1)};$('group-previous').onclick=()=>{if(state.groupPage>1)loadGroups(state.groupPage-1)};$('group-next').onclick=()=>{if(state.groupPage<state.groupPages)loadGroups(state.groupPage+1)};$('group-save').onclick=()=>saveGroup();$('group-recompute').onclick=recomputeGroup;$('group-approve').onclick=approveGroup;
    document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.ctrlKey&&e.key==='Enter')saveReview('save_correction');else if(e.key.toLowerCase()==='a')saveReview('approve');else if(e.key.toLowerCase()==='e')saveReview('save_correction');else if(e.key.toLowerCase()==='n')saveReview('needs_engineer');else if(e.key.toLowerCase()==='r')saveReview('reject')});if(key.value)loadQueue(1);
    // Keep the common path small: answer and scope are visible, while the
    // extraction metadata remains available under an opt-in advanced section.
    function compactEditor(box){
      const answerSection=[...box.querySelectorAll('.section')].find(s=>s.querySelector('#edit-answer-text'));
      if(!answerSection||box.querySelector('.advanced-editor'))return;
      const levelField=box.querySelector('#edit-scope-level')?.closest('.field');
      const advanced=make('details',{class:'advanced-editor'});
      advanced.append(make('summary',{},'高级编辑（可选）'));
      const body=make('div',{class:'advanced-body'});
      const grid=answerSection.querySelector('.form-grid');
      if(grid){
        [...grid.children].forEach(field=>{if(field!==levelField)body.append(field)});
        if(!grid.children.length)grid.remove();
      }
      [...answerSection.children].forEach(node=>{
        if(node.classList?.contains('field')&&!node.querySelector('#edit-answer-text')&&node!==levelField)body.append(node);
      });
      const scopeSection=[...box.querySelectorAll('.section')].find(s=>s.querySelector('#edit-scope-brands'));
      if(scopeSection)body.append(scopeSection);
      advanced.append(body);
      answerSection.querySelector('.section-title').textContent='快速审核（通常只需修改答案和泛化层级）';
      const inlineApprove=box.querySelector('.save-row .approve');
      if(inlineApprove)inlineApprove.textContent='批准并立即发布';
      answerSection.insertAdjacentElement('afterend',advanced);
    }
    const fullRenderEditor=renderEditor;
    renderEditor=(d)=>{fullRenderEditor(d);compactEditor($('candidate-editor'))};

    // Approval publishes immediately; the group action follows the same rule.
    $('approve').textContent='批准并立即发布';
  </script>
</body>
